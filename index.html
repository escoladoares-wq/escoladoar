  <aside class="rule" style="border-left-color:var(--low)">
    <h2>Para as próximas fases</h2>
    <p>Na carga e na conferência entram a <strong>balança</strong> (de cozinha 10 kg / 1 g, sem desligamento automático, serve para cargas pequenas), as <strong>garras de temperatura</strong> do manifold e o <strong>alicate amperímetro</strong> para a corrente do compressor.</p>
  </aside>
</template>

<template id="t-carga">
  <header>
    <span class="eyebrow">Fase 05 · Serviço</span>
    <h1>Carga do gás</h1>
    <p class="lede">Dois momentos diferentes. Na instalação nova, o gás já vem dentro da condensadora: é só liberar e, se a linha passar do padrão, completar a diferença. Na manutenção, o gás foi embora por um vazamento e precisa ser recomposto.</p>
  </header>

  <section aria-label="Os dois momentos">
    <h2>Os dois momentos</h2>
    <div class="tbl">
      <table>
        <thead><tr><th></th><th>A · Liberação (instalação nova)</th><th>B · Recarga (manutenção)</th></tr></thead>
        <tbody>
          <tr><td><strong>Onde está o gás</strong></td><td>Preso na condensadora desde a fábrica, com as válvulas fechadas</td><td>Parte saiu pelo vazamento, parte ainda está no sistema</td></tr>
          <tr><td><strong>Antes</strong></td><td>Linha montada, estanqueidade e vácuo</td><td>Diagnóstico, achar e consertar o vazamento</td></tr>
          <tr><td><strong>Quanto colocar</strong></td><td>Nada, ou só o adicional por metro extra de linha</td><td>A carga completa da etiqueta (mais o adicional da linha)</td></tr>
          <tr><td><strong>Instrumento</strong></td><td>Chave Allen; balança só se houver adicional</td><td>Recolhedora, bomba de vácuo, balança, manifold</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Liberação">
    <h2>A · Liberação da carga de fábrica</h2>
    <div class="stage">
      <svg viewBox="0 0 760 260" role="img" aria-label="Condensadora com as válvulas sendo abertas pela chave Allen; o gás sai da condensadora e enche as linhas até a evaporadora">
        <rect x="40" y="70" width="260" height="150" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="120" cy="145" r="50" fill="none" stroke="var(--muted)" stroke-width="3"/>
        <g class="spin" style="animation-duration:4s"><path d="M120 100 v90 M75 145 h90" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/></g>
        <text x="170" y="245" text-anchor="middle" font-family="var(--display)" font-size="16" font-weight="700" fill="var(--ink)">CONDENSADORA · gás de fábrica</text>
        <rect x="230" y="110" width="40" height="26" fill="var(--high)"/><rect x="230" y="160" width="40" height="30" fill="var(--low)"/>
        <g font-family="var(--mono)" font-size="12" fill="var(--ink)"><text x="196" y="128">1º</text><text x="196" y="180">2º</text></g>
        <g fill="none" stroke-linecap="round">
          <path d="M270 123 H620 V60 H700" stroke="var(--high)" stroke-width="6"/>
          <path d="M270 175 H650 V90 H700" stroke="var(--low)" stroke-width="9"/>
          <path d="M270 123 H620 V60 H700" stroke="var(--surface)" stroke-width="2" class="flux"/>
          <path d="M270 175 H650 V90 H700" stroke="var(--surface)" stroke-width="3" class="flux"/>
        </g>
        <rect x="690" y="40" width="50" height="70" rx="8" fill="var(--frost)" stroke="var(--ink)" stroke-width="2"/>
        <text x="715" y="130" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--muted)">evap.</text>
        <text x="440" y="110" font-family="var(--mono)" font-size="12" fill="var(--high)">1º abre a fina (líquido)</text>
        <text x="440" y="200" font-family="var(--mono)" font-size="12" fill="var(--low)">2º abre a grossa (sucção)</text>
      </svg>
      <p class="cap">O vácuo já deixou as linhas vazias. Ao abrir as válvulas, o gás da condensadora ocupa linhas e evaporadora. Abra até o batente, sem forçar, e recoloque as tampas.</p>
    </div>

    <h3 class="kit-h">Precisa completar? Faça a conta</h3>
    <div class="calc">
      <label>Comprimento real da linha (m)<input id="c-real" type="number" inputmode="decimal" step="0.1" min="0" value="7"></label>
      <label>Comprimento já incluído na etiqueta (m)<input id="c-pad" type="number" inputmode="decimal" step="0.1" min="0" value="5"></label>
      <label>Adicional do manual (g por metro)<input id="c-gm" type="number" inputmode="decimal" step="1" min="0" value="20"></label>
      <output id="c-out" class="calc-out" for="c-real c-pad c-gm"></output>
    </div>
    <ul class="notes">
      <li>Os valores acima são um exemplo. O comprimento padrão e os gramas por metro estão no manual de instalação do modelo, e mudam de aparelho para aparelho.</li>
      <li>Linha menor que o padrão: em geral não se tira gás. Confira o que o manual diz para comprimento mínimo.</li>
      <li>Meça a linha de verdade, de flange a flange, uma só vez (não some ida e volta).</li>
    </ul>
  </section>

  <section aria-label="Adicional na balança">
    <h2>Colocando gás na balança</h2>
    <div class="stage">
      <svg viewBox="0 0 760 270" role="img" aria-label="Lata de R-410A de cabeça para baixo sobre balança de cozinha, mangueira amarela até o manifold, mangueira azul até a saída de serviço; visor da balança marca menos 40 gramas">
        <rect x="50" y="200" width="180" height="30" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="80" y="232" width="120" height="26" rx="4" fill="var(--frost)" stroke="var(--ink)" stroke-width="2"/>
        <text x="140" y="251" text-anchor="middle" font-family="var(--mono)" font-size="16" fill="var(--ink)">−40 g</text>
        <g transform="rotate(180 140 130)">
          <rect x="108" y="70" width="64" height="120" rx="22" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
          <rect x="128" y="52" width="24" height="20" fill="var(--ink)"/>
        </g>
        <text x="140" y="140" text-anchor="middle" font-family="var(--display)" font-size="16" font-weight="700" fill="var(--ink)">R-410A</text>
        <path d="M140 210 C140 260 260 260 330 190" fill="none" stroke="var(--warn)" stroke-width="5" stroke-linecap="round"/>
        <rect x="320" y="120" width="140" height="80" rx="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <circle cx="360" cy="160" r="16" fill="var(--low)"/><circle cx="420" cy="160" r="16" fill="var(--frost)" stroke="var(--high)" stroke-width="3"/>
        <text x="420" y="200" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--high)">fechado</text>
        <path d="M360 120 C360 60 560 60 600 130" fill="none" stroke="var(--low)" stroke-width="5" stroke-linecap="round"/>
        <rect x="580" y="130" width="150" height="90" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="596" y="140" width="22" height="16" fill="var(--low)"/>
        <text x="655" y="190" text-anchor="middle" font-family="var(--display)" font-size="15" font-weight="700" fill="var(--ink)">LIGADO, NO FRIO</text>
        <g class="drops" fill="var(--accent)"><circle cx="365" cy="100" r="4"/><circle cx="420" cy="75" r="4"/><circle cx="500" cy="72" r="4"/></g>
        <text x="470" y="40" font-family="var(--mono)" font-size="12" fill="var(--ink)">registro azul aos poucos: pequenas doses</text>
      </svg>
      <p class="cap">Lata virada (R-410A sai líquido), aparelho ligado no frio máximo, gás só pela baixa. O registro abre um pouco e fecha, várias vezes, para o líquido entrar em doses e evaporar antes de chegar ao compressor.</p>
    </div>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Purgar a mangueira</strong></td><td>Lata ligada na amarela, solte um instante o engate no manifold para expulsar o ar da mangueira.</td></tr>
          <tr><td class="gas">2</td><td><strong>Pesar</strong></td><td>Lata na balança, mangueira solta sem puxar. Tare ou anote o peso inicial.</td></tr>
          <tr><td class="gas">3</td><td><strong>Dosar</strong></td><td>Abra o registro azul aos poucos, em pequenas doses. Pare um pouco antes do valor e complete devagar.</td></tr>
          <tr><td class="gas">4</td><td><strong>Fechar e conferir</strong></td><td>Feche a lata e o registro. Anote o que saiu. Siga para a conferência (superaquecimento).</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes"><li>Com o aparelho ligado, <strong>nunca abra o registro vermelho</strong> com a lata conectada: a alta empurra gás para dentro da lata.</li></ul>
  </section>

  <section aria-label="Recarga">
    <h2>B · Recomposição do gás (recarga)</h2>
    <p style="margin:0 0 14px">Aparelho que já funcionava e perdeu gás. A regra de ouro vale aqui: se faltou, tem vazamento. Colocar gás sem consertar é pagar para o cliente perder de novo.</p>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Diagnóstico</strong></td><td>Confirmar que é falta de gás e não filtro sujo, ventilador fraco ou restrição.</td></tr>
          <tr><td class="gas">2</td><td><strong>Recolher</strong></td><td>Tirar o gás que sobrou com a recolhedora para um cilindro próprio. Pesar diz quanto havia.</td></tr>
          <tr><td class="gas">3</td><td><strong>Consertar</strong></td><td>Achar o vazamento (espuma, nitrogênio, detector) e refazer o flange ou a solda.</td></tr>
          <tr><td class="gas">4</td><td><strong>Estanqueidade e vácuo</strong></td><td>Como nas fases 03 e 04.</td></tr>
          <tr><td class="gas">5</td><td><strong>Carga completa</strong></td><td>Valor da etiqueta mais o adicional da linha, todo pela balança. Com o sistema em vácuo e desligado, entra a maior parte. O resto, com o aparelho ligado, em doses pela baixa.</td></tr>
          <tr><td class="gas">6</td><td><strong>Conferência</strong></td><td>Superaquecimento, pressões e corrente.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="tbl" style="margin-top:14px">
      <table>
        <thead><tr><th>E completar sem tirar tudo?</th><th>Quando</th></tr></thead>
        <tbody>
          <tr><td><strong>R-32 e R-134a</strong></td><td>São gases puros. Completar não muda a composição, mas sem saber quanto restou, você só acerta pelo superaquecimento.</td></tr>
          <tr><td><strong>R-410A</strong></td><td>É mistura, mas quase não se separa num vazamento. Muitos fabricantes aceitam completar. Mesmo assim, carga completa pela balança é o único jeito de saber o número exato.</td></tr>
          <tr><td><strong>Inverter</strong></td><td>Prefira sempre recolher, vácuo e carga completa: o fabricante calibra o aparelho pelo peso.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: completa até 110</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <use href="#tec" x="20" y="50" width="40" height="80"/>
          <rect x="74" y="18" width="112" height="56" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <path d="M86 74 l-10 14 l22 -14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <text x="130" y="42" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--ink)">COMPLETA</text>
          <text x="130" y="60" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--ink)">ATÉ 110</text>
        </svg>
        <p><b>1</b>Sem achar o vazamento, completou "pela pressão" num dia quente.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <rect x="40" y="40" width="120" height="60" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <text x="100" y="78" text-anchor="middle" font-size="22" font-family="var(--mono)" fill="var(--high)">+300 g</text>
          <text x="100" y="122" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--high)">GÁS DE MAIS</text>
        </svg>
        <p><b>2</b>O sol subiu a pressão: pareceu pouco gás e entrou demais. Líquido voltando no compressor.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <rect x="40" y="96" width="120" height="16" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <g transform="rotate(180 100 70)"><rect x="80" y="44" width="40" height="52" rx="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/></g>
          <text x="100" y="132" text-anchor="middle" font-size="13" font-family="var(--mono)" fill="var(--ink)">0 g → −850 g</text>
        </svg>
        <p><b>3</b>Refeito: vazamento consertado, vácuo, e a carga da etiqueta inteira pela balança.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <use href="#tec" x="20" y="50" width="40" height="80"/>
          <rect x="80" y="30" width="100" height="56" rx="8" fill="var(--frost)" stroke="var(--ink)" stroke-width="2"/>
          <text x="130" y="64" text-anchor="middle" font-size="18" font-family="var(--mono)" fill="var(--accent)">SH 6 °C</text>
          <path d="M110 104 l10 10 l22 -24" stroke="var(--accent)" stroke-width="4" fill="none"/>
        </svg>
        <p><b>4</b>Superaquecimento no lugar. O peso decide a carga; a pressão só confirma.</p>
      </figure>
    </div>
  </section>

  <aside class="rule">
    <h2>Lembrete</h2>
    <p>Gás se coloca por peso. Pressão e superaquecimento servem para conferir o resultado, não para decidir quanto colocar.</p>
  </aside>
</template>

<template id="t-conferencia">
  <header>
    <span class="eyebrow">Fase 06 · Serviço</span>
    <h1>Conferência</h1>
    <p class="lede">Gás no lugar, aparelho ligado. Agora se confere a saúde da linha: sem vazamento, bem isolada e trabalhando nos números certos. Só depois disso o serviço é entregue.</p>
  </header>

  <section aria-label="Isolamento">
    <h2>Por que isolar a linha</h2>
    <div class="stage">
      <svg viewBox="0 0 760 250" role="img" aria-label="Dois tubos de sucção frios: o sem isolamento sua e pinga água; o isolado fica seco por fora">
        <text x="190" y="28" text-anchor="middle" font-family="var(--display)" font-size="17" font-weight="800" fill="var(--high)">SEM ISOLAMENTO</text>
        <text x="570" y="28" text-anchor="middle" font-family="var(--display)" font-size="17" font-weight="800" fill="var(--accent)">ISOLADO</text>
        <rect x="40" y="80" width="300" height="34" rx="17" fill="var(--cu)" stroke="var(--ink)" stroke-width="2"/>
        <g fill="var(--low)"><circle cx="80" cy="118" r="4"/><circle cx="140" cy="119" r="3"/><circle cx="210" cy="118" r="4"/><circle cx="270" cy="119" r="3"/><circle cx="310" cy="118" r="4"/></g>
        <g class="pingos" fill="var(--low)"><path d="M100 130 q5 -9 10 0 q-5 9 -10 0z"/><path d="M200 130 q5 -9 10 0 q-5 9 -10 0z"/><path d="M290 130 q5 -9 10 0 q-5 9 -10 0z"/></g>
        <text x="190" y="200" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--ink)">tubo a ~5 °C, ar úmido em volta:</text>
        <text x="190" y="218" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--ink)">a umidade condensa e pinga</text>
        <rect x="410" y="62" width="320" height="70" rx="35" fill="var(--muted)" opacity=".35" stroke="var(--ink)" stroke-width="2"/>
        <rect x="420" y="80" width="300" height="34" rx="17" fill="var(--cu)" stroke="var(--ink)" stroke-width="2"/>
        <text x="570" y="200" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--ink)">a face de fora do isolante fica</text>
        <text x="570" y="218" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--ink)">na temperatura do ambiente: seca</text>
      </svg>
    </div>
    <div class="tbl" style="margin-top:14px">
      <table>
        <thead><tr><th>Sem isolar, acontece</th><th>Como evitar</th></tr></thead>
        <tbody>
          <tr><td><strong>Goteira</strong> na parede, no móvel, no forro</td><td>Cada linha com o seu isolante, inteiro, sem frestas</td></tr>
          <tr><td><strong>Perda de rendimento</strong>: o gás frio pega calor no caminho</td><td>Isolar até encostar na válvula e na evaporadora</td></tr>
          <tr><td><strong>Porca suando</strong> e corroendo</td><td>Isolar as porcas depois da conferência, com isolante e fita</td></tr>
          <tr><td><strong>Isolante esfarelando</strong> no sol</td><td>Fita de acabamento por cima, de baixo para cima; trecho exposto protegido</td></tr>
          <tr><td><strong>Troca de calor entre as linhas</strong></td><td>Linha fina também isolada; no inverter ela esquenta no modo aquecimento</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Técnicas de detecção">
    <h2>Técnicas para achar vazamento</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Técnica</th><th>Como funciona</th><th>Bom para</th><th>Cuidado</th></tr></thead>
        <tbody>
          <tr><td><strong>Olho na mancha de óleo</strong></td><td>O óleo sai junto com o gás e deixa a região oleosa, empoeirada</td><td>Primeira olhada, de graça</td><td>Só aparece em vazamento antigo</td></tr>
          <tr><td><strong>Espuma</strong></td><td>Bolhas onde o gás escapa</td><td>Flanges, válvulas, soldas à vista</td><td>Precisa de acesso; microvazamento demora a aparecer</td></tr>
          <tr><td><strong>Detector eletrônico</strong></td><td>Sensor "fareja" o gás no ar</td><td>Lugares escondidos, serpentinas, caixa da evaporadora</td><td>Vento atrapalha. Confira se ele detecta o seu gás (R-32 e R-1234yf nem todos)</td></tr>
          <tr><td><strong>Líquido contrastante (UV)</strong></td><td>Corante fluorescente vai junto com o óleo; a lanterna UV mostra o ponto brilhando</td><td>Vazamento intermitente, que só aparece funcionando</td><td>Use só corante aprovado para o óleo e o compressor. Alguns fabricantes de inverter não aceitam</td></tr>
          <tr><td><strong>Nitrogênio com hidrogênio</strong></td><td>Mistura 95/5; o detector de hidrogênio acha a menor molécula que existe</td><td>Microvazamento difícil</td><td>Mistura e detector próprios, mais caros</td></tr>
          <tr><td><strong>Teste por trechos</strong></td><td>Separa linha, evaporadora e condensadora e pressuriza cada parte</td><td>Pressão cai e ninguém acha onde</td><td>Dá trabalho, mas elimina suspeitos</td></tr>
          <tr><td><strong>Imersão em água</strong></td><td>Peça com nitrogênio mergulhada num tanque; sai uma fileira de bolhas</td><td>Serpentina ou peça desmontada, na bancada</td><td>Secar bem e fazer vácuo longo depois</td></tr>
          <tr><td><strong>Ultrassom</strong></td><td>Escuta o chiado do gás escapando, inaudível para nós</td><td>Ambiente com muito vento ou cheiro de outros gases</td><td>Barulho de máquina em volta atrapalha</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Na conferência, com o gás já em pressão de trabalho, passe espuma nos quatro flanges mais uma vez antes de isolar as porcas.</li>
    </ul>
  </section>

  <section aria-label="Saúde da linha">
    <h2>A saúde da linha</h2>
    <p style="margin:0 0 12px">Aparelho no frio máximo (ou no modo teste do inverter), filtros limpos, 15 minutos funcionando. Marque cada ponto conferido.</p>
    <div class="tbl"><table class="kit"><tbody>
      <tr><td><input type="checkbox" id="s-sh"></td><td><label for="s-sh"><strong>Superaquecimento</strong></label></td><td>Garra azul na linha grossa, perto da condensadora, isolada do ambiente. Dentro do valor do fabricante (muitos splits ficam por volta de 5 a 7 °C).</td></tr>
      <tr><td><input type="checkbox" id="s-baixa"></td><td><label for="s-baixa"><strong>Pressão de baixa</strong></label></td><td>Coerente com o gás e o dia. No inverter ela muda com a rotação: leia no modo teste.</td></tr>
      <tr><td><input type="checkbox" id="s-ar"></td><td><label for="s-ar"><strong>Diferença do ar</strong></label></td><td>Termômetro na entrada e na saída da evaporadora. Costuma dar uns 8 a 12 °C de diferença.</td></tr>
      <tr><td><input type="checkbox" id="s-corrente"></td><td><label for="s-corrente"><strong>Corrente</strong></label></td><td>Alicate amperímetro na alimentação. Abaixo do máximo da etiqueta.</td></tr>
      <tr><td><input type="checkbox" id="s-tubo"></td><td><label for="s-tubo"><strong>Tubo de sucção</strong></label></td><td>Frio até a condensadora. Gelo na válvula ou na evaporadora é sinal de problema.</td></tr>
      <tr><td><input type="checkbox" id="s-espuma"></td><td><label for="s-espuma"><strong>Espuma final</strong></label></td><td>Quatro flanges e válvulas, com gás em pressão de trabalho.</td></tr>
      <tr><td><input type="checkbox" id="s-tampas"></td><td><label for="s-tampas"><strong>Tampas das válvulas</strong></label></td><td>Recolocadas e apertadas, inclusive a da saída de serviço.</td></tr>
      <tr><td><input type="checkbox" id="s-isola"></td><td><label for="s-isola"><strong>Isolamento fechado</strong></label></td><td>Porcas isoladas, emendas fechadas, fita de acabamento.</td></tr>

<template id="t-recolhimento">
  <header>
    <span class="eyebrow">Fase 08 · Manutenção</span>
    <h1>Recolhimento</h1>
    <p class="lede">Desmontar um ar para levar a outro lugar, ou abrir o sistema para conserto, sem perder o gás. Ele é guardado dentro da própria condensadora ou num cilindro de recolhimento. Soltar na atmosfera, nunca.</p>
  </header>

  <section aria-label="Os dois jeitos">
    <h2>Os dois jeitos de recolher</h2>
    <div class="tbl">
      <table>
        <thead><tr><th></th><th>Na condensadora (pump down)</th><th>Com recolhedora</th></tr></thead>
        <tbody>
          <tr><td><strong>Como</strong></td><td>O próprio compressor empurra o gás para dentro da condensadora</td><td>Uma máquina transfere o gás para um cilindro de recolhimento</td></tr>
          <tr><td><strong>Quando</strong></td><td>Mudança de lugar, troca de linha, conserto na evaporadora</td><td>Compressor parado ou queimado, conserto na condensadora, aparelho para descarte</td></tr>
          <tr><td><strong>Precisa</strong></td><td>Manifold, chave Allen, aparelho funcionando</td><td>Recolhedora, cilindro de recolhimento, balança, manifold</td></tr>
          <tr><td><strong>Tempo</strong></td><td>Poucos minutos</td><td>De 15 minutos a mais de uma hora</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Pump down">
    <h2>Recolher na condensadora</h2>
    <div class="stage">
      <svg viewBox="0 0 760 300" role="img" aria-label="À esquerda, condensadora com a válvula fina fechada primeiro e o gás sendo puxado para dentro; à direita, gráfico da pressão de baixa caindo até zero em cerca de um minuto e meio, quando se fecha a válvula grossa e desliga">
        <rect x="30" y="80" width="250" height="150" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <text x="155" y="255" text-anchor="middle" font-family="var(--display)" font-size="16" font-weight="700" fill="var(--ink)">CONDENSADORA</text>
        <rect x="210" y="115" width="40" height="26" fill="var(--high)"/><rect x="210" y="165" width="40" height="30" fill="var(--low)"/>
        <g font-family="var(--mono)" font-size="12" fill="var(--ink)"><text x="168" y="133">1º</text><text x="168" y="185">3º</text></g>
        <path d="M250 128 H330" stroke="var(--high)" stroke-width="6"/>
        <path d="M300 116 l20 24 M320 116 l-20 24" stroke="var(--high)" stroke-width="4"/>
        <path d="M250 180 H330" stroke="var(--low)" stroke-width="9"/>
        <path d="M330 180 H250" stroke="var(--surface)" stroke-width="3" class="flux"/>
        <text x="40" y="40" font-family="var(--mono)" font-size="12" fill="var(--high)">1º fecha a fina: o gás para de sair</text>
        <text x="40" y="58" font-family="var(--mono)" font-size="12" fill="var(--low)">o compressor puxa o que está na linha</text>
        <!-- gráfico -->
        <g stroke="var(--line)"><path d="M430 240H730M430 180H730M430 120H730M430 60H730"/></g>
        <g font-family="var(--mono)" font-size="11" fill="var(--muted)" text-anchor="end"><text x="424" y="244">0</text><text x="424" y="184">40</text><text x="424" y="124">80</text><text x="424" y="64">120</text></g>
        <text x="380" y="40" font-family="var(--mono)" font-size="11" fill="var(--muted)">baixa (psi)</text>
        <g font-family="var(--mono)" font-size="11" fill="var(--muted)" text-anchor="middle"><text x="430" y="262">0</text><text x="530" y="262">1 min</text><text x="630" y="262">2 min</text></g>
        <path d="M430 70 C470 160 500 215 580 236 H600" fill="none" stroke="var(--low)" stroke-width="4"/>
        <circle r="6" fill="var(--low)" class="vac" style="offset-path:path('M430 70 C470 160 500 215 580 236 H600')"/>
        <path d="M600 40V240" stroke="var(--high)" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="608" y="100" font-family="var(--display)" font-size="15" font-weight="700" fill="var(--high)">2º e 3º:</text>
        <text x="608" y="118" font-family="var(--mono)" font-size="12" fill="var(--ink)">desliga e</text>
        <text x="608" y="134" font-family="var(--mono)" font-size="12" fill="var(--ink)">fecha a grossa</text>
        <text x="430" y="290" font-family="var(--mono)" font-size="11" fill="var(--muted)">tempo típico de um split pequeno; varia com a linha e a carga</text>
      </svg>
      <p class="cap">A válvula fina fecha primeiro: o gás líquido fica preso na condensadora. O compressor continua puxando a linha grossa até a pressão de baixa chegar perto de zero. Aí desliga e fecha a grossa.</p>
    </div>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Preparar</strong></td><td>Manifold azul na saída de serviço da válvula grossa. Tire as tampas das duas válvulas.</td></tr>
          <tr><td class="gas">2</td><td><strong>Ligar no frio</strong></td><td>Frio máximo, temperatura no mínimo. No inverter, use o modo teste ou o botão de refrigeração forçada, para o compressor não parar no meio.</td></tr>
          <tr><td class="gas">3</td><td><strong>Fechar a fina</strong></td><td>Com o compressor rodando há alguns minutos, feche a válvula de líquido até o batente.</td></tr>
          <tr><td class="gas">4</td><td><strong>Olhar a baixa</strong></td><td>A pressão cai. Quando chegar perto de zero, siga sem demora: compressor puxando vácuo esquenta e pode puxar ar pelos flanges.</td></tr>
          <tr><td class="gas">5</td><td><strong>Desligar e fechar a grossa</strong></td><td>Desligue o aparelho e feche logo a válvula de sucção. Se a pressão subir depois de desligado, ainda havia gás: repita rápido.</td></tr>
          <tr><td class="gas">6</td><td><strong>Cortar a energia</strong></td><td>Desligue o disjuntor antes de soltar o cabo PP.</td></tr>
          <tr><td class="gas">7</td><td><strong>Soltar e tampar</strong></td><td>Solte os flanges. Tampe na hora as válvulas da condensadora e os tubos da evaporadora, com as porcas ou tampões e fita.</td></tr>
        </tbody>
      </table>
    </div>
    <aside class="rule" style="margin-top:14px">
      <h2>Perigo: compressor ligado e flange solto</h2>
      <p>Nunca solte um flange com o compressor rodando. Ele puxa ar para dentro do sistema junto com o óleo, e essa mistura sob pressão já fez compressores explodirem. Primeiro desliga e fecha tudo, depois desmonta.</p>
    </aside>
  </section>

  <section aria-label="Recolhedora">
    <h2>Recolher com a recolhedora</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Cilindro certo</strong></td><td>Cilindro próprio de recolhimento (corpo cinza, ombro amarelo), com válvula de duas saídas. Um cilindro para cada gás.</td></tr>
          <tr><td class="gas">2</td><td><strong>Pesar</strong></td><td>Cilindro na balança. Ele só pode ser cheio até 80% da capacidade em peso, para sobrar espaço se esquentar.</td></tr>
          <tr><td class="gas">3</td><td><strong>Ligar</strong></td><td>Aparelho → manifold → entrada da recolhedora; saída da recolhedora → cilindro. Purgue o ar das mangueiras.</td></tr>
          <tr><td class="gas">4</td><td><strong>Recolher</strong></td><td>Siga o manual da recolhedora: primeiro a fase líquida, depois o vapor, até a pressão do aparelho ficar perto de zero ou em leve vácuo.</td></tr>
          <tr><td class="gas">5</td><td><strong>Anotar</strong></td><td>Peso final menos peso inicial: é o gás que havia no aparelho. Etiquete o cilindro com o gás e o peso.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Nunca recolha para dentro de lata descartável. Ela não é feita para ser recarregada e pode romper.</li>
      <li>Não misture gases no mesmo cilindro. Gás misturado não tem reaproveitamento e vai para destruição.</li>
      <li>Gás contaminado (de compressor queimado, por exemplo) vai para uma central de regeneração, não de volta para outro aparelho.</li>
    </ul>
  </section>

  <section aria-label="Transporte e reinstalação">
    <h2>Transporte e nova instalação</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ponto</th><th>O que fazer</th></tr></thead>
        <tbody>
          <tr><td><strong>Condensadora</strong></td><td>Sempre em pé, presa, sem tombar. Deitada, o óleo sai do compressor para a linha.</td></tr>
          <tr><td><strong>Evaporadora</strong></td><td>Tubos protegidos, serpentina sem apoio de peso, aletas sem amassar.</td></tr>
          <tr><td><strong>Pontas</strong></td><td>Tudo tampado durante o transporte. Umidade entra rápido.</td></tr>
          <tr><td><strong>Linha velha</strong></td><td>Se reaproveitar, corte os flanges antigos e passe nitrogênio para limpar. Linha amassada ou suja, troque.</td></tr>
          <tr><td><strong>No novo local</strong></td><td>É uma instalação nova: fases 01, 03, 04, 05 e 06. Estanqueidade e vácuo antes de abrir as válvulas.</td></tr>
          <tr><td><strong>Carga</strong></td><td>Parte do gás pode ter se perdido. Se a linha nova tiver outro comprimento, refaça a conta do adicional e confira o superaquecimento. Na dúvida, recolha, pese e refaça a carga.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: a mudança</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <use href="#tec" x="20" y="50" width="40" height="80"/>

<template id="t-pend">
  <header>
    <span class="eyebrow" data-k="eyebrow"></span>
    <h1 data-k="title"></h1>
    <p class="lede" data-k="lede"></p>
  </header>
  <div class="pend">
    <h2>Em construção</h2>
    <p style="margin:0">Esta fase vai ser montada na nossa conversa. Já combinamos estes pontos:</p>
    <ul data-k="items"></ul>
  </div>
</template>

<script>
const FASES=[
  {id:"aparelho",n:"A",t:"O aparelho por dentro",grp:"Fundamentos",ok:true},
  {id:"ciclo",n:"B",t:"O ciclo de refrigeração",grp:"Fundamentos",ok:true,lede:"Por onde o gás circula e onde acontecem as trocas de calor.",items:["Compressor, condensador, expansão e evaporador","Os quatro estados do gás no caminho"]},
  {id:"gases",n:"C",t:"Os gases",grp:"Fundamentos",ok:true},
  {id:"linhas",n:"01",t:"Montagem das linhas",grp:"Instalação",ok:true},
  {id:"instrumentos",n:"02",t:"Instrumentos",grp:"Instalação",ok:true,lede:"Manifold digital, balança, bomba de vácuo e o que cada um mede.",items:["Balança de cozinha 10 kg / 1 g sem desligamento automático serve para cargas pequenas","Os três modos do manifold: estanqueidade, vacuômetro e gás","Garras de temperatura: superaquecimento e sub-resfriamento"]},
  {id:"vazamento",n:"03",t:"Estanqueidade",grp:"Serviço",ok:true,lede:"Achar e confirmar o fim do vazamento com nitrogênio.",items:["Nitrogênio seco com regulador, nunca oxigênio","Modo estanqueidade: pressão estável por 15 a 30 minutos"]},
  {id:"vacuo",n:"04",t:"Vácuo",grp:"Serviço",ok:true,lede:"Tirar ar e umidade de dentro do sistema.",items:["Alvo abaixo de 500 microns","Teste de queda com a bomba desligada"]},
  {id:"carga",n:"05",t:"Carga do gás",grp:"Serviço",ok:true,lede:"Colocar a quantidade certa, medida na balança.",items:["Carga = etiqueta + metros extras × g/m do manual","R-410A sempre como líquido"]},
  {id:"conferencia",n:"06",t:"Conferência",grp:"Serviço",ok:true,lede:"Ver o aparelho funcionando com a carga certa.",items:["Superaquecimento com a garra azul na linha grossa","Esperar 10 a 15 minutos para estabilizar"]},
  {id:"diagnostico",n:"07",t:"Diagnóstico",grp:"Manutenção",ok:true,lede:"Descobrir o que o aparelho tem antes de mexer no gás.",items:["Pressão mostra temperatura, não quantidade","Filtro sujo e ventilador fraco enganam a leitura","Roteiro de bolso: pressão, superaquecimento e corrente"]},
  {id:"recolhimento",n:"08",t:"Recolhimento",grp:"Manutenção",ok:true,lede:"Tirar o gás que restou sem soltar na atmosfera.",items:["Recolhedora e cilindro próprio","Pesar o que saiu para saber quanto havia"]},
  {id:"higienizacao",n:"09",t:"Higienização",grp:"Manutenção",ok:true,lede:"Limpar com produto e esterilizar com vapor.",items:["Bolsa coletora, produto neutro, enxágue","Vapor no final para esterilizar serpentina, turbina e bandeja"]},
];
const tocList=document.getElementById("toc-list"),view=document.getElementById("view");
let grp="Fundamentos",html="";
FASES.forEach(f=>{
  if(f.grp!==grp){grp=f.grp;html+=`<div class="grp">${grp}</div>`;}
  html+=`<a href="#${f.id}" data-id="${f.id}"><span class="n">${f.n}</span><span>${f.t}</span><span class="st">${f.ok?"":"em breve"}</span></a>`;
});
tocList.outerHTML=html;
const msel=document.getElementById("msel");
msel.innerHTML='<option value="inicio">Início · Como usar</option>'+FASES.map(f=>`<option value="${f.id}">${f.n} · ${f.t}${f.ok?"":" (em breve)"}</option>`).join("");
msel.addEventListener("change",()=>{location.hash=msel.value;});

function render(){
  const mob=matchMedia("(max-width:860px)").matches;
  const id=(location.hash||(mob?"#inicio":"#aparelho")).slice(1);
  if(id==="inicio"){renderInicio();return;}
  const i=Math.max(0,FASES.findIndex(f=>f.id===id));const f=FASES[i];
  let node;
  if(f.ok){node=document.getElementById("t-"+f.id).content.cloneNode(true);}
  else{
    node=document.getElementById("t-pend").content.cloneNode(true);
    node.querySelector('[data-k="eyebrow"]').textContent=f.grp==="Fundamentos"?`Fundamento ${f.n}`:`Fase ${f.n} · ${f.grp}`;
    node.querySelector('[data-k="title"]').textContent=f.t;
    node.querySelector('[data-k="lede"]').textContent=f.lede;
    node.querySelector('[data-k="items"]').innerHTML=f.items.map(x=>`<li>${x}</li>`).join("");
  }
  const p=FASES[i-1]||(mob?{id:"inicio",t:"Início"}:null),n=FASES[i+1];
  const nav=document.createElement("nav");nav.className="passo";nav.setAttribute("aria-label","Navegação entre fases");
  nav.innerHTML=(p?`<a href="#${p.id}">← ${p.t}</a>`:"<span></span>")+(n?`<a href="#${n.id}">${n.t} →</a>`:"<span></span>");
  view.replaceChildren(node,nav);
  view.style.display="flex";view.style.flexDirection="column";view.style.gap="34px";
  document.querySelectorAll("[data-id]").forEach(a=>{if(a.dataset.id===f.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  msel.value=f.id;document.body.classList.remove("em-inicio");
  prepMobile();
  setupKit();setupCalc();setupClear();setupPecas();setupGauge();setupSH();setupFicha();
  if(location.hash) window.scrollTo(0,0);
}
function setupCalc(){
  const r=view.querySelector('#c-real');if(!r)return;
  const p=view.querySelector('#c-pad'),g=view.querySelector('#c-gm'),o=view.querySelector('#c-out');
  const upd=()=>{const extra=Math.max(0,(+r.value||0)-(+p.value||0));const add=Math.round(extra*(+g.value||0));
    o.innerHTML=add>0?`Completar ${add} g<small>${extra.toLocaleString('pt-BR',{maximumFractionDigits:1})} m além do padrão × ${g.value||0} g/m</small>`:`Não precisa completar<small>A linha está dentro do comprimento da etiqueta.</small>`;};
  [r,p,g].forEach(i=>i.addEventListener('input',upd));upd();
}
function renderInicio(){
  const node=document.getElementById("t-inicio").content.cloneNode(true);
  node.querySelector("#mapa").innerHTML=FASES.map(f=>`<a href="#${f.id}"><span class="n">${f.n}</span><span>${f.t}</span><em class="${f.ok?"ok":""}">${f.ok?"pronta":"em breve"}</em></a>`).join("");
  view.replaceChildren(node);
  view.style.display="flex";view.style.flexDirection="column";view.style.gap="30px";
  document.querySelectorAll("[data-id]").forEach(a=>a.removeAttribute("aria-current"));
  msel.value="inicio";document.body.classList.add("em-inicio");
  window.scrollTo(0,0);
}
function prepMobile(){
  view.querySelectorAll("table").forEach(t=>{
    const hs=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    if(!hs.length) return;
    t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{const h=hs[i];if(h&&h!=="#")td.dataset.label=h;}));
  });
  view.querySelectorAll(".stage > svg").forEach(svg=>{
    const b=document.createElement("button");b.type="button";b.className="zoom";b.textContent="Ampliar desenho";
    b.addEventListener("click",()=>openZoom(svg));svg.after(b);
  });
}
const zoomBox=document.getElementById("zoom");
function openZoom(svg){
  const area=zoomBox.querySelector(".zoom-area");area.replaceChildren(svg.cloneNode(true));
  zoomBox.hidden=false;document.body.style.overflow="hidden";zoomBox.querySelector("button").focus();
}
function closeZoom(){zoomBox.hidden=true;document.body.style.overflow="";}
zoomBox.querySelector("button").addEventListener("click",closeZoom);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!zoomBox.hidden)closeZoom();});
const PT={
 "R-410A":{c:"--g410",r:136,d:[[-28.9,26.4],[-17.8,48.6],[-12.2,62.3],[-6.7,78.3],[-1.1,96.8],[4.4,118],[10,142.2],[15.6,169.6],[21.1,200.6],[26.7,235.3],[32.2,274.1],[37.8,317.2],[43.3,365],[48.9,418],[54.4,476]]},
 "R-32":{c:"--g32",r:114,d:[[-28.9,27.6],[-17.8,50],[-6.7,80.5],[4.4,121],[15.6,173.5],[26.7,240.5],[37.8,324],[48.9,427],[54.4,486]]},
 "R-22":{c:"--g22",r:92,d:[[-28.9,10.2],[-17.8,24],[-12.2,32.8],[-6.7,43],[-1.1,54.9],[4.4,68.5],[10,84],[15.6,101.6],[21.1,121.4],[26.7,143.6],[32.2,168.4],[37.8,195.9],[43.3,226.4],[48.9,259.9],[54.4,296.8],[60,337.3]]},
 "R-134a":{c:"--g134",r:70,d:[[-17.8,6.5],[-12.2,11.9],[-6.7,18.4],[-1.1,26.1],[4.4,35.1],[10,45.5],[15.6,57.4],[21.1,71.1],[26.7,86.7],[32.2,104.3],[37.8,124.1],[43.3,146.3],[48.9,171.1],[54.4,198.7],[60,229]]}};
function interp(d,x,ix,iy){for(let k=0;k<d.length-1;k++){const a=d[k],b=d[k+1];if(x>=a[ix]&&x<=b[ix])return a[iy]+(x-a[ix])*(b[iy]-a[iy])/(b[ix]-a[ix]);}return null;}
const p2t=(g,p)=>interp(PT[g].d,p,1,0), t2p=(g,t)=>interp(PT[g].d,t,0,1);
const ang=p=>(-135+p*270/500)*Math.PI/180;
const xy=(r,p)=>[200+r*Math.sin(ang(p)),200-r*Math.cos(ang(p))];
const fmt=v=>v==null?"fora da tabela":v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" °C";
function setupSH(){
  const g=view.querySelector("#sh-g");if(!g)return;
  const p=view.querySelector("#sh-p"),t=view.querySelector("#sh-t"),o=view.querySelector("#sh-out");
  const upd=()=>{const ts=p2t(g.value,+p.value);
    if(ts==null||p.value===""||t.value===""){o.innerHTML="Preencha a pressão e a temperatura<small>A pressão precisa estar dentro da tabela do gás.</small>";return;}
    const sh=+t.value-ts;const f=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
    let msg,cor;
    if(sh<3){msg="Baixo: risco de líquido voltar ao compressor. Confira filtros e ventilador interno antes de pensar em excesso de gás.";cor="var(--low)";}
    else if(sh<=8){msg="Na faixa comum de splits com capilar. Confirme com o valor do manual.";cor="var(--accent)";}
    else{msg="Alto: evaporadora recebendo pouco gás. Suspeite de falta de gás ou restrição.";cor="var(--high)";}
    o.style.color=cor;o.innerHTML=`Superaquecimento ${f(sh)} °C<small>Evaporação a ${f(ts)} °C (${g.value} a ${p.value} psi). ${msg}</small>`;};
  [g,p,t].forEach(i=>i.addEventListener("input",upd));upd();
}
function setupFicha(){
  const fm=view.querySelector("#ficha");if(!fm)return;
  const ids=["f-data","f-cli","f-ap","f-q","f-p","f-t","f-sh","f-a","f-v","f-ar","f-ach","f-fiz"];
  let d={};try{d=JSON.parse(localStorage.getItem("ficha")||"{}")}catch(e){}
  const el=id=>fm.querySelector("#"+id);
  ids.forEach(id=>{if(d[id]!=null)el(id).value=d[id];el(id).addEventListener("input",()=>{d[id]=el(id).value;try{localStorage.setItem("ficha",JSON.stringify(d))}catch(e){}});});
  if(!el("f-data").value)el("f-data").value=new Date().toISOString().slice(0,10);
  const msg=fm.querySelector("#f-msg"),txt=fm.querySelector("#f-txt");
  fm.addEventListener("submit",e=>{e.preventDefault();
    const L=(k,id,u="")=>el(id).value?`${k}: ${el(id).value}${u}`:null;
    const out=["FICHA DE ATENDIMENTO · Escola do Ar",L("Data","f-data"),L("Cliente","f-cli"),L("Aparelho","f-ap"),L("Queixa","f-q"),
      L("Baixa","f-p"," psi"),L("Tubo grosso","f-t"," °C"),L("Superaquecimento","f-sh"," °C"),L("Corrente","f-a"," A"),L("Tensão","f-v"," V"),L("Ar entrada/saída","f-ar"," °C"),
      L("Encontrei","f-ach"),L("Fiz","f-fiz")].filter(Boolean).join("\n");
    txt.value=out;
    const fallback=()=>{txt.hidden=false;txt.focus();txt.select();msg.textContent="Texto selecionado: copie com o botão do celular.";};
    try{navigator.clipboard.writeText(out).then(()=>{msg.textContent="Ficha copiada.";txt.hidden=true;},fallback);}catch(err){fallback();}
  });
  fm.querySelector("#f-limpa").addEventListener("click",()=>{ids.forEach(id=>el(id).value="");d={};try{localStorage.removeItem("ficha")}catch(e){}el("f-data").value=new Date().toISOString().slice(0,10);txt.hidden=true;msg.textContent="Ficha em branco.";});
}
function setupGauge(){
  const svg=view.querySelector("#pt-svg");if(!svg)return;
  let h='<circle cx="200" cy="200" r="194" fill="var(--surface)" stroke="var(--ink)" stroke-width="4"/>';
  for(let p=0;p<=500;p+=10){const big=p%50===0;const[a,b]=xy(big?166:174,p),[c,d]=xy(184,p);h+=`<path d="M${a.toFixed(1)} ${b.toFixed(1)}L${c.toFixed(1)} ${d.toFixed(1)}" stroke="var(--ink)" stroke-width="${big?2.5:1.2}"/>`;
    if(p%100===0){const[x,y]=xy(152,p);h+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="13" font-weight="500" fill="var(--ink)">${p}</text>`;}}
  for(const g in PT){const G=PT[g];
    const[a0,b0]=xy(G.r+9,0),[a1,b1]=xy(G.r+9,500);
    h+=`<g class="ring" data-g="${g}"><path d="M${a0.toFixed(1)} ${b0.toFixed(1)}A${G.r+9} ${G.r+9} 0 1 1 ${a1.toFixed(1)} ${b1.toFixed(1)}" fill="none" stroke="var(${G.c})" stroke-width="2" opacity=".5"/>`;
    let last=-99;
    for(let t=-20;t<=60;t+=10){const p=t2p(g,t);if(p==null||p<0||p>500)continue;const[x,y]=xy(G.r,p);if(Math.hypot(x-(last[0]||0),y-(last[1]||0))<18)continue;last=[x,y];
      h+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="10.5" fill="var(${G.c})">${t}</text>`;}
    h+='</g>';}
  h+='<text x="200" y="262" text-anchor="middle" font-family="var(--display)" font-size="14" font-weight="700" fill="var(--muted)">psi · anéis em °C</text>';
  h+='<g id="pt-ndl"><path d="M200 214 L200 30" stroke="var(--high)" stroke-width="3.5" stroke-linecap="round"/><circle cx="200" cy="200" r="11" fill="var(--ink)"/></g>';
  svg.innerHTML=h;
  const legend=Object.keys(PT).map(g=>`<text font-family="var(--display)" font-size="14" font-weight="700" fill="var(${PT[g].c})">${g}</text>`);
  const lg=document.createElementNS("http://www.w3.org/2000/svg","g");lg.innerHTML=legend.map((t,i)=>t.replace("<text",`<text x="${150+(i%2)*100}" y="${300+Math.floor(i/2)*20}" text-anchor="middle"`)).join("");svg.appendChild(lg);
  const inp=view.querySelector("#pt-p"),pv=view.querySelector("#pt-pv"),gn=view.querySelector("#pt-gn"),tt=view.querySelector("#pt-t"),all=view.querySelector("#pt-all"),gb=view.querySelector("#pt-gases"),ndl=svg.querySelector("#pt-ndl");
  let gas="R-410A";
  gb.innerHTML=Object.keys(PT).map(g=>`<button type="button" data-g="${g}" style="--gc:var(${PT[g].c})">${g}</button>`).join("");
  const upd=()=>{const p=+inp.value;pv.textContent=p;
    ndl.setAttribute("transform",`rotate(${(-135+p*270/500).toFixed(2)} 200 200)`);
    gn.textContent=gas;tt.textContent=fmt(p2t(gas,p));
    all.innerHTML=Object.keys(PT).map(g=>`<li style="--gc:var(${PT[g].c})"><span>${g}</span><span>${fmt(p2t(g,p))}</span></li>`).join("");
    gb.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===gas));
    svg.querySelectorAll(".ring").forEach(r=>r.style.opacity=r.dataset.g===gas?1:.3);};
  gb.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;gas=b.dataset.g;upd();});
  inp.addEventListener("input",upd);upd();
}
function setupPecas(){
  view.querySelectorAll(".stage").forEach(st=>{
    const svg=st.querySelector("svg.vx");if(!svg)return;
    const sec=st.closest("section");
    const set=pid=>{
      const same=svg.dataset.on===pid;const on=same?"":pid;svg.dataset.on=on;
      svg.classList.toggle("foco",!!on);
      svg.querySelectorAll("[data-p]").forEach(el=>el.classList.toggle("on",el.dataset.p===on));
      sec.querySelectorAll("tr[data-p]").forEach(tr=>tr.classList.toggle("on",tr.dataset.p===on));
    };
    svg.querySelectorAll(".co").forEach(c=>{c.addEventListener("click",()=>set(c.dataset.p));c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set(c.dataset.p);}});});
    sec.querySelectorAll("tr[data-p]").forEach(tr=>{tr.tabIndex=0;tr.addEventListener("click",()=>{set(tr.dataset.p);if(innerWidth<=860)svg.scrollIntoView({behavior:"smooth",block:"center"});});tr.addEventListener("keydown",e=>{if(e.key==="Enter"){set(tr.dataset.p);}});});
  });
}
function setupClear(){
  const b=view.querySelector('#s-limpar');if(!b)return;
  b.addEventListener('click',()=>{let saved={};try{saved=JSON.parse(localStorage.getItem('kit')||'{}')}catch(e){}
    view.querySelectorAll('.kit input').forEach(i=>{i.checked=false;saved[i.id]=false;});
    try{localStorage.setItem('kit',JSON.stringify(saved))}catch(e){}b.textContent='Pronto para o próximo serviço';});
}
function setupKit(){
  const boxes=view.querySelectorAll('.kit input');if(!boxes.length)return;
  let saved={};try{saved=JSON.parse(localStorage.getItem('kit')||'{}')}catch(e){}
  const sum=view.querySelector('.kit-sum');
  const upd=()=>{const n=[...boxes].filter(b=>b.checked).length;if(sum)sum.textContent=`Você já tem ${n} de ${boxes.length} itens.`;};
  boxes.forEach(b=>{b.checked=!!saved[b.id];b.addEventListener('change',()=>{saved[b.id]=b.checked;try{localStorage.setItem('kit',JSON.stringify(saved))}catch(e){}upd();});});
  upd();
}
addEventListener("hashchange",render);render();
</script>
