<style>
/* Manual de bancada: menu lateral com as fases em ordem de serviço; cada fase = animação, tirinha, tabela. Azul = baixa, vermelho = alta, como no manifold. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#14232c; --muted:#53656f; --line:#cfdbe2;
  --low:#1f6fb2; --high:#c8372d; --frost:#d9ecf7; --accent:#0e8a8a; --warn:#b26a00; --g410:#c2185b; --g32:#6a3fb5; --g22:#2e7d32; --g134:#0277bd; --cu:#c98a4b; --cu2:#e2b07a; --side:#000c24; --side-ink:#e6f0ff; --side-muted:#8fa6c9; --side-hi:#0f2a5c; --side-acc:#3aa0ff;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#15232b; --ink:#e3edf2; --muted:#9db0ba; --line:#2a3d48;
  --low:#5aa9ea; --high:#f0695e; --frost:#1c3646; --accent:#3cc4c0; --warn:#e6a23c; --g410:#f06292; --g32:#b388ff; --g22:#66bb6a; --g134:#4fc3f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#15232b; --ink:#e3edf2; --muted:#9db0ba; --line:#2a3d48;
  --low:#5aa9ea; --high:#f0695e; --frost:#1c3646; --accent:#3cc4c0; --warn:#e6a23c; --g410:#f06292; --g32:#b388ff; --g22:#66bb6a; --g134:#4fc3f7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%;}
.toc{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:22px 18px 28px;border-right:1px solid var(--line);background:var(--side);color:var(--side-ink)}
.logo{display:block;width:100%;max-width:234px;height:auto;margin:0 auto 4px;border-radius:12px}
.toc .brand-sub{color:var(--side-muted)}
.toc .grp{color:var(--side-muted)}
.toc a{color:var(--side-ink)}
.toc a .n,.toc a .st{color:var(--side-muted)}
.toc a:hover,.toc a[aria-current="page"]{background:var(--side-hi)}
.toc a[aria-current="page"] .n{color:var(--side-acc)}
.toc a:focus-visible{outline-color:var(--side-acc)}
.mtop{display:none}
.brand{font:800 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.brand svg{width:30px;height:30px}
.brand-sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.grp{font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.toc a{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:4px;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:15px}
.toc a .n{font:500 13px var(--mono)}
.toc a .st{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.toc a[aria-current="page"]{font-weight:700}
.toc a:focus-visible,.passo a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

main{padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font:800 clamp(38px,6vw,62px)/.95 var(--display);text-transform:uppercase;margin:8px 0 12px;text-wrap:balance}
h2{font:700 28px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;text-wrap:balance}
.lede{font-size:19px;max-width:62ch;color:var(--muted);margin:0}
p{max-width:65ch}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;overflow-x:auto}
.stage svg{display:block;width:100%;min-width:560px;height:auto}
.cap{font-size:13px;color:var(--muted);margin:10px 0 0}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.panel svg{display:block;width:100%;height:auto;background:var(--frost)}
.panel p{margin:0;padding:10px 12px;font-size:14.5px;line-height:1.45}
.panel b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);display:block}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.gas{font:700 18px var(--display);white-space:nowrap}
.chip{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.a1{color:var(--accent)} .a2l{color:var(--warn)} .a3{color:var(--high)}
.notes{margin:10px 0 0;padding-left:20px;font-size:14.5px;color:var(--muted)}

.rule{border-left:6px solid var(--high);background:var(--surface);padding:18px 22px;border-radius:0 12px 12px 0}
.rule h2{font-size:22px;margin-bottom:6px}
.rule p{margin:0}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:0;list-style:none}
.flow li{font:700 15px var(--display);letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:6px;background:var(--frost)}

.kit-h{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px;color:var(--accent)}
.kit{min-width:520px}
.kit td:first-child{width:44px}
.kit input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.kit label{cursor:pointer}
.kit tr:has(input:checked) td{color:var(--muted)}
.kit tr:has(input:checked) strong{text-decoration:line-through}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.calc input{font:500 20px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.calc input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.calc-out{grid-column:1/-1;font:700 22px var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--accent);border-top:1px solid var(--line);padding-top:12px}
.calc-out small{display:block;font:400 14px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
@keyframes pinga{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.drops circle{animation:pinga 1.8s ease-in infinite}.drops circle:nth-child(2){animation-delay:.6s}.drops circle:nth-child(3){animation-delay:1.2s}
.pingos path{animation:pinga 1.6s ease-in infinite}.pingos path:nth-child(2){animation-delay:.5s}.pingos path:nth-child(3){animation-delay:1s}
@keyframes brilho{0%,100%{opacity:.25}50%{opacity:.9}}
.uv{animation:brilho 1.8s ease-in-out infinite}
.btn{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.btn:hover{background:var(--frost)}.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.abre{background:var(--side);color:var(--side-ink);border-radius:16px;padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.abre img{width:100%;max-width:360px;height:auto;border-radius:12px}
.abre p{margin:0;color:var(--side-muted);font-size:16.5px;max-width:40ch}
.abre-cta{display:block;width:100%;max-width:360px;padding:14px;border-radius:10px;background:var(--side-acc);color:var(--side);font:800 19px var(--display);text-transform:uppercase;letter-spacing:.04em;text-decoration:none}
.abre-cta:focus-visible{outline:3px solid var(--side-ink);outline-offset:3px}
.guia{list-style:none;counter-reset:g;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.guia li{counter-increment:g;display:grid;grid-template-columns:38px 1fr;column-gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.guia li::before{content:counter(g);grid-row:span 2;font:800 26px/1 var(--display);color:var(--accent)}
.guia b{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em}
.guia span{font-size:15.5px;color:var(--muted)}
.mapa{display:flex;flex-direction:column;gap:8px}
.mapa a{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.mapa .n{font:500 14px var(--mono);color:var(--muted)}
.mapa em{font-style:normal;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mapa em.ok{color:var(--accent)}
.mapa a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.em-inicio .mtop{display:none}
.vx .pc,.vx .co{transition:opacity .3s}
.vx.foco .pc:not(.on),.vx.foco .co:not(.on){opacity:.15}
.vx .co{cursor:pointer}
.vx .co:focus-visible circle{stroke:var(--ink);stroke-width:3}
.vx .co.on circle{fill:var(--high)}
.pecas tr[data-p]{cursor:pointer}
.pecas tr[data-p]:hover td{background:var(--frost)}
.pecas tr.on td{background:var(--frost)}
.pecas tr.on td.gas{color:var(--high)}
.pecas tr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
@keyframes rodar{to{transform:rotate(360deg)}}
.helice{animation:rodar 1.4s linear infinite}
@keyframes passar{to{transform:translateX(9px)}}
.giro{animation:passar .5s linear infinite}
@media (max-width:640px){.pecas tr.on{border-color:var(--high);background:var(--frost)}}
@keyframes volta{to{offset-distance:100%}}
@keyframes corgas{0%{fill:var(--high)}10.78%{fill:var(--high)}37.04%{fill:var(--warn)}39.55%{fill:var(--warn)}40.67%{fill:var(--accent)}46.26%{fill:var(--accent)}72.51%{fill:var(--low)}98.1%{fill:var(--low)}100%{fill:var(--high)}}
.gota{offset-path:path("M674 400 L740 400 L740 100 L720 100 L560 100 L560 135 L720 135 L720 170 L560 170 L560 205 L720 205 L720 240 L560 240 L470 240 L430 240 L230 240 L70 240 L70 205 L230 205 L230 170 L70 170 L70 135 L230 135 L230 100 L70 100 L30 100 L30 400 L606 400 L674 400");offset-rotate:0deg;stroke:var(--surface);stroke-width:2;animation:volta 12s linear infinite,corgas 12s linear infinite}
@keyframes subirar{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
.ciclo .ar{animation:subirar 2s ease-out infinite}
.pt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.pt-gauge svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.pt-ctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.pt-lab{font-size:15px;color:var(--muted)}
.pt-lab output{font:700 20px var(--mono);color:var(--ink)}
#pt-p{width:100%;accent-color:var(--accent);height:28px}
.pt-gases{display:flex;flex-wrap:wrap;gap:8px}
.pt-gases button{font:700 16px var(--display);padding:8px 12px;border-radius:8px;border:2px solid var(--gc);background:var(--surface);color:var(--ink);cursor:pointer}
.pt-gases button[aria-pressed="true"]{background:var(--gc);color:var(--surface)}
.pt-gases button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pt-lcd{background:var(--side);color:var(--side-ink);border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:12px}
.pt-lcd span{font:700 16px var(--display);color:var(--side-acc)}
.pt-lcd b{font:500 34px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.pt-lcd small{grid-column:1/-1;color:var(--side-muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.pt-all{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pt-all li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:8px;border-left:4px solid var(--gc);background:var(--bg);font:500 14px var(--mono)}
@media (max-width:640px){.pt{grid-template-columns:1fr;padding:12px}.pt-lcd b{font-size:28px}}
@keyframes acende{0%,15%{opacity:1}20%,100%{opacity:.55}}
.degrau{animation:acende 5s infinite}
.roteiro .up{color:var(--high)}.roteiro .dn{color:var(--low)}.roteiro .eq{color:var(--accent)}
.roteiro td{white-space:nowrap}.roteiro td:nth-child(n+4){white-space:normal}
@media (max-width:640px){.tbl .roteiro tr{display:flex;flex-direction:column}.tbl .roteiro td{white-space:normal}.tbl .roteiro td:last-child{order:-1;font-size:17px;margin-bottom:2px}.tbl .roteiro td:last-child::before{display:none}.tbl .roteiro td:first-child{font-weight:400;font-size:15.5px}.tbl .roteiro td:first-child[data-label]::before{display:block}}
.calc select{font:500 18px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ficha label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.ficha input,.ficha textarea{font:400 16px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.ficha input:focus-visible,.ficha textarea:focus-visible,.calc select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.ficha .w2{grid-column:1/-1}
.ficha-bt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#f-msg{font-size:14px;color:var(--accent)}
@keyframes etapa{0%,22%{opacity:1}26%,100%{opacity:.4}}
.etapa{animation:etapa 8s infinite}
@keyframes borrifa{0%{opacity:0;transform:translateX(-30px)}40%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
.borrifo circle{animation:borrifa 1.6s ease-out infinite}.borrifo circle:nth-child(2n){animation-delay:.5s}.borrifo circle:nth-child(3n){animation-delay:1s}
@keyframes sobe{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.vapor path{animation:sobe 2.2s ease-out infinite}.vapor path:nth-child(2){animation-delay:1.1s}
.pend{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:28px}
.pend ul{margin:8px 0 0;padding-left:20px}
.passo{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em}
.passo a{color:var(--accent);text-decoration:none}

/* animação do ciclo */
.flowdot{offset-rotate:0deg}
@keyframes runpath{to{offset-distance:100%}}
.dot{animation:runpath 6s linear infinite}
@keyframes needle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.ndl{transform-box:fill-box;transform-origin:50% 100%;animation:needle 2.4s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes walk{0%,15%{transform:translateX(0)}16.6%,32%{transform:translateX(124px)}33.3%,48%{transform:translateX(248px)}50%,65%{transform:translateX(372px)}66.6%,82%{transform:translateX(496px)}83.3%,100%{transform:translateX(620px)}}
.hl{animation:walk 12s infinite}
.flux{stroke-dasharray:6 18;animation:fluxo 1.6s linear infinite}
@keyframes fluxo{to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 2s linear infinite}
@keyframes subir{0%{transform:rotate(-120deg)}35%,100%{transform:rotate(60deg)}}
.gauge{transform-box:view-box;transform-origin:380px 150px;animation:subir 6s ease-out infinite}
@keyframes bolha{0%,60%{opacity:0;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.bubbles circle{animation:bolha 3s ease-out infinite}
.bubbles circle:nth-child(2){animation-delay:.6s}.bubbles circle:nth-child(3){animation-delay:1.2s}
.vac{animation:runpath 5s ease-out infinite}
@media (prefers-reduced-motion:reduce){.dot,.ndl,.bar,.hl,.spin,.flux,.gauge,.bubbles circle,.vac,.drops circle,.pingos path,.uv,.helice,.giro,.gota,.ciclo .ar,.degrau,.etapa,.borrifo circle,.vapor path{animation:none}}


/* celular */
.zoom{display:none}
.msel{display:none}
.zoombox{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.zoombox[hidden]{display:none}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--side);color:var(--side-ink);font-size:13px}
.zoom-bar button{font:700 15px var(--display);text-transform:uppercase;padding:8px 14px;border-radius:8px;border:0;background:var(--side-acc);color:var(--side);cursor:pointer}
.zoom-area{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.zoom-area svg{display:block;width:960px;max-width:none;height:auto;background:var(--surface);border-radius:12px}
@media (max-width:860px){
  main{padding-block:14px 40px}
  .wrap{gap:26px}
  .msel{display:flex;align-items:center;gap:10px;margin-bottom:-8px}
  .msel span{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .msel select{flex:1;min-width:0;font:700 17px var(--display);text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .stage{padding:12px;overflow:visible}
  .stage svg{min-width:0}
  .zoom{display:inline-block;margin-top:10px;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
  h2{font-size:24px}
  .lede{font-size:17px}
}
@media (max-width:640px){
  .tbl{border:0;background:none;overflow:visible;border-radius:0}
  .tbl table{min-width:0;font-size:15.5px}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .tbl td{border:0;padding:3px 0}
  .tbl td:first-child{font-weight:700;font-size:17px}
  .tbl td[data-label]::before{content:attr(data-label);display:block;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .tbl td:first-child[data-label]::before{display:none}
  .tbl td.gas:first-child{font-size:22px;color:var(--accent)}
  .tbl tr:has(> td.gas:first-child + td){display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
  .tbl tr:has(> td.gas:first-child + td) > td:nth-child(n+3){grid-column:1/-1}
  .tbl td.gas:first-child + td{font-size:17px}
  .tbl td.gas:first-child + td[data-label]::before{display:none}

      <li><b>Escolha a fase</b><span>Na lista <strong>Fase</strong>, no topo da tela, toque e escolha. As fases estão na ordem do serviço.</span></li>
      <li><b>Leia de cima para baixo</b><span>Cada fase tem uma animação, uma tirinha com a história do erro e do acerto, e tabelas com os passos.</span></li>
      <li><b>Amplie os desenhos</b><span>Desenho pequeno? Toque em <strong>Ampliar desenho</strong>. Ele abre em tela cheia: arraste para os lados ou gire o celular.</span></li>
      <li><b>Avance pelo rodapé</b><span>No fim de cada fase, os botões <strong>← anterior</strong> e <strong>próxima →</strong> levam à fase vizinha.</span></li>
      <li><b>Monte a sua caixa</b><span>Em <strong>02 Instrumentos</strong>, marque o que você já tem. Fica guardado neste celular e vira a sua lista de compras.</span></li>
      <li><b>Calcule o gás</b><span>Em <strong>05 Carga do gás</strong>, a calculadora diz quanto completar pelo comprimento da linha.</span></li>
      <li><b>Confira cada serviço</b><span>Em <strong>06 Conferência</strong>, marque os pontos da saúde da linha. No fim, toque em limpar para o próximo serviço.</span></li>
      <li><b>Tenha à mão</b><span>No Chrome, toque em <strong>⋮</strong> e em <strong>Adicionar à tela inicial</strong>. A Escola do Ar vira um ícone no seu celular.</span></li>
    </ol>

</svg>
      <p class="cap">À esquerda, o lado do ar: painel, hélice, motor e serpentina. À direita, depois da divisória, o lado do gás e da eletrônica: compressor, acumulador, válvulas e placa.</p>
    </div>
    <div class="tbl">
      <table class="pecas">
        <thead><tr><th>#</th><th>Peça</th><th>Função</th><th>Na manutenção</th></tr></thead>
        <tbody>
          <tr data-p="c1"><td class="gas">1</td><td><strong>Tampa superior</strong></td><td>Fecha a parte de cima</td><td>Solta primeiro para acessar placa e compressor</td></tr>
          <tr data-p="c2"><td class="gas">2</td><td><strong>Painel frontal com grade</strong></td><td>Protege a hélice e orienta a saída do ar</td><td>Nada encostado na frente: o ar quente precisa sair</td></tr>
          <tr data-p="c3"><td class="gas">3</td><td><strong>Hélice</strong></td><td>Ventilador axial que puxa o ar pela serpentina</td><td>Pá trincada ou desbalanceada vibra e faz barulho</td></tr>
          <tr data-p="c4"><td class="gas">4</td><td><strong>Motor do ventilador</strong></td><td>Gira a hélice; no inverter costuma ser motor DC</td><td>Rolamento seco faz ruído; conferir se gira livre</td></tr>
          <tr data-p="c5"><td class="gas">5</td><td><strong>Serpentina (condensador)</strong></td><td>Em L, atrás e na lateral: aqui o gás entrega o calor ao ar de fora</td><td>Folhas, poeira e gordura; limpar no sentido das aletas</td></tr>
          <tr data-p="c6"><td class="gas">6</td><td><strong>Divisória</strong></td><td>Separa o lado do ventilador do lado do compressor</td><td>Mantém o fluxo de ar no caminho certo</td></tr>
          <tr data-p="c7"><td class="gas">7</td><td><strong>Compressor</strong></td><td>O coração: puxa o gás frio e o empurra quente e em alta pressão. No inverter, rotativo e de velocidade variável</td><td>Corrente, ruído e temperatura; não liga sem gás</td></tr>
          <tr data-p="c8"><td class="gas">8</td><td><strong>Acumulador de sucção</strong></td><td>Garrafa antes do compressor: segura líquido que tenha voltado</td><td>Protege o compressor do golpe de líquido</td></tr>
          <tr data-p="c9"><td class="gas">9</td><td><strong>Válvula de 4 vias</strong></td><td>Inverte o caminho do gás nos modelos quente e frio</td><td>Bobina queimada ou válvula travada: não troca de modo</td></tr>
          <tr data-p="c10"><td class="gas">10</td><td><strong>Válvula de expansão eletrônica</strong></td><td>Derruba a pressão do líquido e dosa o gás; em modelos simples é um capilar</td><td>Bobina e conector; travada dá baixa pressão ou superaquecimento errado</td></tr>
          <tr data-p="c11"><td class="gas">11</td><td><strong>Placa inverter e dissipador</strong></td><td>Controla a rotação do compressor e do motor</td><td>Capacitores guardam carga: espere descarregar antes de mexer</td></tr>
          <tr data-p="c12"><td class="gas">12</td><td><strong>Válvulas de serviço</strong></td><td>Ligam as linhas; a grossa tem a saída de serviço</td><td>Tampas sempre recolocadas e apertadas</td></tr>
          <tr data-p="c13"><td class="gas">13</td><td><strong>Base</strong></td><td>Sustenta tudo; o compressor fica sobre pés de borracha</td><td>Base nivelada, coxins inteiros, dreno livre</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>A posição das peças muda de marca para marca. Em muitos modelos a válvula de expansão (ou o capilar) fica na condensadora, e por isso a linha fina já chega fria na evaporadora.</li>
      <li>Antes de abrir qualquer unidade: disjuntor desligado e, no inverter, espere alguns minutos para os capacitores da placa descarregarem.</li>
    </ul>
  </section>

  <aside class="rule" style="border-left-color:var(--low)">
    <h2>Duas trocas de calor</h2>
    <p>As duas serpentinas são o motivo de tudo: na evaporadora o gás <strong>tira</strong> o calor do cômodo, na condensadora ele <strong>entrega</strong> esse calor ao ar de fora. O caminho do gás entre elas é o assunto do próximo fundamento.</p>
  </aside>
</template>

      <p class="cap">A cor da bolinha mostra o estado do gás: vermelho é vapor quente em alta, laranja é líquido em alta, verde-azulado é mistura fria em baixa e azul é vapor frio em baixa. Os números marcam os quatro pontos da tabela abaixo.</p>

  <section aria-label="Os quatro pontos">
    <h2>Os quatro pontos do gás</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Onde</th><th>Estado</th><th>Pressão (R-410A)</th><th>Temperatura</th></tr></thead>
        <tbody style="font-variant-numeric:tabular-nums">
          <tr><td class="gas" style="color:var(--high)">1</td><td><strong>Saída do compressor</strong> (descarga)</td><td>Vapor superaquecido</td><td>Alta, ~340 a 400 psi</td><td>Muito quente, ~70 a 80 °C</td></tr>
          <tr><td class="gas" style="color:var(--warn)">2</td><td><strong>Saída da condensadora</strong></td><td>Líquido sub-resfriado</td><td>Alta</td><td>Morno, ~35 a 40 °C</td></tr>
          <tr><td class="gas" style="color:var(--accent)">3</td><td><strong>Depois da expansão</strong></td><td>Mistura de líquido e vapor</td><td>Baixa, ~115 a 130 psi</td><td>Fria, ~3 a 6 °C</td></tr>
          <tr><td class="gas" style="color:var(--low)">4</td><td><strong>Saída da evaporadora</strong> (sucção)</td><td>Vapor superaquecido</td><td>Baixa</td><td>Frio, ~10 a 12 °C</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Valores típicos de um split R-410A no frio, num dia de ~35 °C. Mudam com o tempo, a carga e o modelo; servem para entender o ciclo, não como gabarito.</li>
      <li>Na maioria dos splits a expansão fica na condensadora. Por isso a <strong>linha fina já atravessa a parede fria e em baixa pressão</strong>, e as duas linhas ficam frias no modo frio.</li>
    </ul>
  </section>

  <section aria-label="Onde acontece cada coisa">
    <h2>Onde acontece cada coisa</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Peça</th><th>O que faz com o gás</th><th>O que acontece com o calor</th></tr></thead>
        <tbody>
          <tr><td><strong>Compressor</strong></td><td>Comprime o vapor frio: pressão e temperatura sobem (ponto 4 → 1)</td><td>Recebe energia elétrica, que vira calor no gás</td></tr>
          <tr><td><strong>Condensadora</strong></td><td>O vapor quente esfria, condensa e sai líquido (1 → 2)</td><td><strong>Troca 2</strong>: entrega ao ar de fora o calor do cômodo mais o do compressor</td></tr>
          <tr><td><strong>Expansão</strong> (capilar ou EEV)</td><td>A pressão despenca e parte do líquido ferve na hora (2 → 3)</td><td>A temperatura cai abaixo da do ar do cômodo</td></tr>
          <tr><td><strong>Evaporadora</strong></td><td>A mistura fria ferve até virar todo vapor (3 → 4)</td><td><strong>Troca 1</strong>: tira calor e umidade do ar do cômodo; a água escorre para o dreno</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Onde medir">
    <h2>O ciclo e as medidas da conferência</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Medida</th><th>Onde no ciclo</th><th>O que mostra</th></tr></thead>
        <tbody>
          <tr><td><strong>Pressão de baixa</strong></td><td>Ponto 4, na saída de serviço</td><td>A temperatura em que o gás está fervendo na evaporadora</td></tr>
          <tr><td><strong>Superaquecimento</strong></td><td>Ponto 4: temperatura do tubo grosso menos a de evaporação</td><td>Se a evaporadora recebe gás demais ou de menos</td></tr>
          <tr><td><strong>Sub-resfriamento</strong></td><td>Ponto 2: temperatura de condensação menos a do líquido</td><td>Se há líquido sobrando na condensadora. Em split, quase nunca há tomada de pressão nesse ponto</td></tr>
          <tr><td><strong>Corrente</strong></td><td>Compressor</td><td>O esforço do compressor; sobe com excesso de gás ou condensadora suja</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: o gás carregador</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <rect x="20" y="30" width="80" height="80" rx="8" fill="var(--frost)" stroke="var(--ink)" stroke-width="2"/>
          <g fill="none" stroke="var(--warn)" stroke-width="3"><path d="M40 100c-5-8 5-14 0-22M60 100c-5-8 5-14 0-22M80 100c-5-8 5-14 0-22"/></g>
          <circle cx="150" cy="70" r="22" fill="var(--accent)"/><text x="150" y="76" text-anchor="middle" font-size="16" font-family="var(--display)" font-weight="800" fill="var(--surface)">GÁS</text>
          <path d="M100 70h26" stroke="var(--warn)" stroke-width="3" marker-end="url(#pt-warn)"/>
        </svg>
        <p><b>1</b>Na evaporadora, o gás frio passa pelo ar do quarto e enche a "mochila" de calor.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <circle cx="100" cy="70" r="40" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
          <path d="M80 54l44 16l-44 16z" fill="var(--ink)"/>
          <text x="100" y="130" text-anchor="middle" font-size="14" font-family="var(--display)" font-weight="700" fill="var(--high)">APERTA: ESQUENTA</text>
        </svg>
        <p><b>2</b>O compressor aperta o gás. Apertado, ele fica mais quente que o ar de fora.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <circle cx="60" cy="70" r="22" fill="var(--high)"/><text x="60" y="76" text-anchor="middle" font-size="16" font-family="var(--display)" font-weight="800" fill="var(--surface)">GÁS</text>
          <g fill="none" stroke="var(--high)" stroke-width="3"><path d="M110 90c-5-8 5-14 0-22M135 90c-5-8 5-14 0-22M160 90c-5-8 5-14 0-22"/></g>
          <text x="135" y="120" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--ink)">LÁ FORA</text>
        </svg>
        <p><b>3</b>Lá fora, como está mais quente que o ar, ele esvazia a mochila: o calor vai embora.</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <rect x="30" y="58" width="60" height="20" fill="var(--warn)"/>
          <rect x="90" y="52" width="24" height="32" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <rect x="114" y="58" width="60" height="20" fill="var(--accent)"/>
          <text x="100" y="118" text-anchor="middle" font-size="14" font-family="var(--display)" font-weight="700" fill="var(--accent)">SOLTA: ESFRIA</text>
        </svg>
        <p><b>4</b>Na expansão a pressão é solta de uma vez: o gás gela e volta para buscar mais calor.</p>
      </figure>
    </div>
  </section>

  <section aria-label="Modo quente">
    <h2>E no modo quente?</h2>
    <p style="margin:0">Nos modelos quente e frio, a <strong>válvula de 4 vias</strong> inverte o caminho na saída do compressor. A serpentina de dentro passa a ser a quente (condensa e solta calor no cômodo) e a de fora vira a fria (tira calor do ar de fora). As peças são as mesmas; só trocam de papel.</p>
    <ul class="notes">
      <li>No quente, a linha fina leva líquido de dentro para fora, e a pressão na saída de serviço da linha grossa é a de <strong>alta</strong>. Cuidado ao ligar o manifold.</li>
      <li>Por isso as leituras de superaquecimento da conferência valem só no modo frio.</li>
    </ul>
  </section>

  <aside class="rule" style="border-left-color:var(--low)">
    <h2>Em uma frase</h2>
    <p>O gás pega calor dentro de casa evaporando, o compressor o aperta, ele entrega o calor lá fora condensando, a expansão o gela de novo, e a volta recomeça.</p>
  </aside>
</template>

          <tr><td><strong>Compressor</strong> (inverter)</td><td>Resistência entre os três terminais U, V e W</td><td>As três medidas iguais entre si. Nunca ligue um compressor inverter direto na rede</td></tr>
          <tr><td><strong>Sensores</strong></td><td>Solte o conector e meça a resistência, anotando a temperatura</td><td>A da tabela do fabricante. Muitos são de 5, 10, 15 ou 20 kΩ a 25 °C</td></tr>
          <tr><td><strong>Cabo PP</strong></td><td>Continuidade de cada fio, ponta a ponta, com o aparelho desligado</td><td>Cada fio no mesmo número dos dois lados, sem emenda ruim</td></tr>
        </tbody>
      </table>
    </div>
    <aside class="rule" style="margin-top:14px">
      <h2>Segurança na elétrica</h2>
      <p>Disjuntor desligado antes de soltar qualquer fio. Na placa inverter os capacitores guardam tensão contínua alta, que pode passar de 300 V, mesmo com o aparelho desligado: espere alguns minutos e meça antes de tocar. Serviço em instalação elétrica é para quem tem capacitação (NR-10).</p>
    </aside>
  </section>

  <section aria-label="Roteiro de bolso">
    <h2>4 · O roteiro de bolso do gás</h2>
    <p style="margin:0 0 12px">Só depois de filtros, serpentinas e ventiladores conferidos. Aparelho no frio máximo (inverter no modo teste), 15 minutos funcionando.</p>
    <div class="tbl">
      <table class="roteiro">
        <thead><tr><th>Baixa</th><th>Superaquec.</th><th>Corrente</th><th>Outros sinais</th><th>Provável causa</th></tr></thead>
        <tbody>
          <tr><td><span class="dn">▼</span> Baixa</td><td><span class="up">▲</span> Alto</td><td><span class="dn">▼</span> Baixa</td><td>Pouco frio, tubo grosso pouco gelado</td><td><strong>Falta de gás</strong>: procure o vazamento</td></tr>
          <tr><td><span class="dn">▼</span> Baixa</td><td><span class="up">▲</span> Alto</td><td><span class="dn">▼</span> Baixa</td><td>Gelo ou suor num ponto da linha fina, depois da peça</td><td><strong>Restrição</strong>: capilar, filtro ou EEV entupidos</td></tr>
          <tr><td><span class="dn">▼</span> Baixa</td><td><span class="dn">▼</span> Baixo</td><td><span class="eq">●</span> Normal</td><td>Evaporadora congelando, pouco ar saindo</td><td><strong>Pouco ar</strong>: filtro, turbina ou motor interno</td></tr>
          <tr><td><span class="up">▲</span> Alta</td><td><span class="dn">▼</span> Baixo</td><td><span class="up">▲</span> Alta</td><td>Tubo grosso gelado até o compressor, às vezes suando</td><td><strong>Excesso de gás</strong>: risco de golpe de líquido</td></tr>
          <tr><td><span class="up">▲</span> Alta</td><td><span class="eq">●</span> Normal</td><td><span class="up">▲</span> Alta</td><td>Ar muito quente saindo da condensadora</td><td><strong>Condensadora</strong> suja, hélice parada ou ar recirculando</td></tr>
          <tr><td><span class="up">▲</span> Alta</td><td><span class="up">▲</span> Alto</td><td><span class="dn">▼</span> Baixa</td><td>Pouco frio, compressor funcionando</td><td><strong>Compressor fraco</strong>: não consegue bombear</td></tr>
          <tr><td><span class="eq">●</span> Normal</td><td><span class="eq">●</span> Normal</td><td><span class="eq">●</span> Normal</td><td>Cliente reclama mesmo assim</td><td><strong>Sistema ok</strong>: veja BTUs, sol, janela aberta, sensor</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>"Alta" e "baixa" aqui comparam com o esperado para o gás e o dia, não um número fixo.</li>
      <li>Falta de gás e restrição dão leituras parecidas. A diferença está no ponto gelado da linha e no histórico: restrição não perde gás.</li>
      <li>No inverter, o compressor muda de rotação e a pressão acompanha. Leia sempre no modo teste.</li>
    </ul>
  </section>

  <section aria-label="Calculadora de superaquecimento">
    <h2>Calculadora de superaquecimento</h2>
    <div class="calc sh">
      <label>Gás<select id="sh-g"><option>R-410A</option><option>R-32</option><option>R-22</option><option>R-134a</option></select></label>
      <label>Pressão de baixa (psi)<input id="sh-p" type="number" inputmode="decimal" step="1" min="0" value="118"></label>
      <label>Temperatura do tubo grosso (°C)<input id="sh-t" type="number" inputmode="decimal" step="0.1" value="10.5"></label>
      <output id="sh-out" class="calc-out" for="sh-g sh-p sh-t"></output>
    </div>
    <ul class="notes">
      <li>Garra no tubo grosso, perto da condensadora, isolada do ambiente. Os valores de exemplo dão um sistema normal.</li>
      <li>As faixas da calculadora são de referência para splits com capilar. O valor certo de cada modelo está no manual.</li>
    </ul>
  </section>

  <section aria-label="Códigos de erro">
    <h2>5 · Códigos de erro do inverter</h2>
    <p style="margin:0 0 12px">O aparelho avisa o defeito com um código no display ou com um LED piscando na placa da condensadora (conte as piscadas). Cada marca tem a sua tabela: o mesmo "E1" quer dizer coisas diferentes em marcas diferentes. Os códigos costumam cair nestes grupos:</p>
    <div class="tbl">
      <table>
        <thead><tr><th>Grupo</th><th>O que avisa</th><th>Comece por</th></tr></thead>
        <tbody>
          <tr><td><strong>Sensor</strong></td><td>Sensor de ambiente, serpentina ou descarga aberto ou em curto</td><td>Conector e resistência do sensor</td></tr>
          <tr><td><strong>Comunicação</strong></td><td>As placas de dentro e de fora não se entendem</td><td>Cabo PP, bornes, ordem dos fios, emenda</td></tr>
          <tr><td><strong>Proteção de alta / temperatura</strong></td><td>Pressão ou temperatura de descarga altas demais</td><td>Condensadora suja, hélice, excesso de gás</td></tr>
          <tr><td><strong>Corrente / módulo de potência</strong></td><td>Corrente alta no compressor ou falha no módulo da placa</td><td>Tensão, compressor (U, V, W), placa inverter</td></tr>
          <tr><td><strong>Ventilador</strong></td><td>Motor DC não informa a rotação</td><td>Motor travado, conector, placa</td></tr>
          <tr><td><strong>Tensão</strong></td><td>Alimentação fora da faixa</td><td>Rede elétrica, disjuntor, aperto dos bornes</td></tr>
          <tr><td><strong>Memória / placa</strong></td><td>Falha interna da placa</td><td>Reset desligando o disjuntor; persistindo, placa</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Guarde a tabela de códigos de cada modelo que você atende. Muitas vêm coladas na tampa da condensadora ou no manual de serviço.</li>
      <li>Anote o código antes de desligar: alguns aparelhos apagam o erro no reset.</li>
    </ul>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: quem só tem manifold</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">

      </figure>

  </section>

  <section aria-label="Ficha do atendimento">
    <h2>Ficha do atendimento</h2>
    <p style="margin:0 0 12px">Preencha no local e toque em copiar para mandar pelo WhatsApp ou guardar. O rascunho fica salvo neste aparelho.</p>
    <form class="ficha" id="ficha">
      <label>Data<input id="f-data" type="date"></label>
      <label>Cliente / local<input id="f-cli" type="text"></label>
      <label>Aparelho (marca, BTU, gás)<input id="f-ap" type="text" placeholder="ex.: 12.000 BTU inverter R-410A"></label>
      <label class="w2">Queixa do cliente<input id="f-q" type="text"></label>
      <label>Baixa (psi)<input id="f-p" type="number" inputmode="decimal"></label>
      <label>Tubo grosso (°C)<input id="f-t" type="number" inputmode="decimal" step="0.1"></label>
      <label>Superaquecimento (°C)<input id="f-sh" type="number" inputmode="decimal" step="0.1"></label>
      <label>Corrente (A)<input id="f-a" type="number" inputmode="decimal" step="0.1"></label>
      <label>Tensão (V)<input id="f-v" type="number" inputmode="decimal"></label>

      <textarea id="f-txt" class="w2" rows="6" readonly hidden></textarea>
    </form>
  </section>

  <aside class="rule" style="border-left-color:var(--low)">
    <h2>Regra do diagnóstico</h2>
    <p>Gás é o último suspeito, não o primeiro. Quem confere elétrica e ar antes do manifold resolve mais rápido e não cobra do cliente um gás que ele não precisava.</p>
  </aside>
</template>

<template id="t-higienizacao">
  <header>
    <span class="eyebrow">Fase 09 · Manutenção</span>
    <h1>Higienização</h1>
    <p class="lede">Limpar com produto e esterilizar com vapor. O químico solta a sujeira e a gordura, o enxágue leva tudo embora e o vapor no final mata fungos e bactérias sem deixar resíduo. É o fim do mau cheiro e a volta do rendimento.</p>
  </header>

  <section aria-label="O processo">
    <h2>O processo completo</h2>
    <div class="stage">
      <svg viewBox="0 0 760 360" role="img" aria-label="Evaporadora em corte com a bolsa coletora instalada embaixo levando a água ao balde; à esquerda o pulverizador com produto, à direita o vaporizador; quatro etapas destacadas em sequência: produto, tempo de ação, enxágue e vapor">
        <!-- parede -->
        <rect x="562" y="20" width="22" height="230" fill="var(--line)"/><text x="573" y="268" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">parede</text>

        <path d="M330 60 L470 60 L520 120" fill="none" stroke="var(--cu)" stroke-width="16" stroke-linejoin="round" opacity=".35"/>

        <g class="spin" style="animation-duration:3s"><path d="M430 98v40M410 118h40M416 104l28 28M444 104l-28 28" stroke="var(--low)" stroke-width="1.5"/></g>
        <path d="M330 142h120" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
        <text x="390" y="134" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--accent)">bandeja</text>
        <rect x="490" y="130" width="40" height="18" rx="3" fill="var(--frost)" stroke="var(--ink)" stroke-width="1.5"/>
        <text x="510" y="143" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink)">placa</text>
        <path d="M486 126h48v26h-48z" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
        
        <text x="430" y="30" text-anchor="middle" font-family="var(--display)" font-size="15" font-weight="700" fill="var(--ink)">EVAPORADORA SEM A TAMPA</text>

        <text x="525" y="282" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">balde</text>

        <!-- pulverizador -->
        <g transform="translate(-50 0)">
          <rect x="120" y="90" width="44" height="80" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
          <path d="M132 90v-18h30l14 8" fill="none" stroke="var(--ink)" stroke-width="3"/>

          <g class="borrifo" fill="var(--accent)"><circle cx="200" cy="80" r="3"/><circle cx="230" cy="72" r="3"/><circle cx="255" cy="86" r="2.5"/><circle cx="280" cy="76" r="3"/><circle cx="215" cy="92" r="2.5"/></g>

          <g class="etapa" style="animation-delay:2s"><rect x="140" y="300" width="100" height="40" rx="8" fill="var(--frost)" stroke="var(--accent)" stroke-width="2"/><text x="190" y="325" text-anchor="middle" fill="var(--ink)">2 ESPERA</text></g>
          <g class="etapa" style="animation-delay:4s"><rect x="250" y="300" width="100" height="40" rx="8" fill="var(--frost)" stroke="var(--accent)" stroke-width="2"/><text x="300" y="325" text-anchor="middle" fill="var(--ink)">3 ENXÁGUE</text></g>
          <g class="etapa" style="animation-delay:6s"><rect x="360" y="300" width="100" height="40" rx="8" fill="var(--frost)" stroke="var(--accent)" stroke-width="2"/><text x="410" y="325" text-anchor="middle" fill="var(--ink)">4 VAPOR</text></g>
        </g>
      </svg>
      <p class="cap">O químico limpa, o enxágue leva o produto embora e o vapor higieniza. A bolsa coletora recolhe tudo e leva ao balde, e a placa fica coberta do começo ao fim.</p>
    </div>
  </section>

  <section aria-label="Químico ou vapor">
    <h2>Químico ou vapor</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ponto</th><th>Produto químico com água</th><th>Vapor</th></tr></thead>
        <tbody>
          <tr><td><strong>Gordura e sujeira grudada</strong></td><td>Muito bom: o produto solta</td><td>Bom na superfície, menos no fundo da serpentina</td></tr>
          <tr><td><strong>Fungos e bactérias</strong></td><td>Bom, se o produto for bactericida</td><td>Muito bom: o calor esteriliza</td></tr>
          <tr><td><strong>Resíduo</strong></td><td>Precisa enxaguar bem, senão fica cheiro e corrói</td><td>Não deixa nada</td></tr>
          <tr><td><strong>Água e bagunça</strong></td><td>Muita água; precisa de bolsa coletora</td><td>Pouca água, quase seco</td></tr>
          <tr><td><strong>Risco ao aparelho</strong></td><td>Produto errado corrói alumínio e cobre</td><td>Calor deforma plástico e afeta a eletrônica</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes"><li>Juntos dão o melhor resultado. Sujeira leve, manutenção de rotina: só o vapor resolve. Aparelho muito sujo ou com gordura (cozinha): o químico entra antes.</li></ul>
  </section>

  <section aria-label="Produto e vapor juntos">
    <h2>Produto com vapor por cima</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Tipo de produto</th><th>Onde usar</th><th>Com vapor por cima</th></tr></thead>
        <tbody>
          <tr><td><strong>Neutro</strong> (de evaporadora)</td><td>Evaporadora, dentro de casa</td><td><span class="chip a1">Tranquilo</span></td></tr>
          <tr><td><strong>Alcalino</strong> (de condensadora)</td><td>Condensadora, do lado de fora</td><td><span class="chip a2l">Enxágue antes</span> o calor deixa o produto mais forte e ataca a aleta</td></tr>
          <tr><td><strong>Ácido</strong></td><td>Só com orientação do fabricante</td><td><span class="chip a3">Não faça</span> ácido quente corrói o alumínio rápido</td></tr>
          <tr><td><strong>Água sanitária, cloro</strong></td><td>Nunca</td><td><span class="chip a3">Nunca</span> corrói alumínio e cobre</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Use produto com registro na Anvisa e respeite a diluição e o tempo de ação do rótulo.</li>
      <li>Alguns produtos de evaporadora são vendidos como "sem enxágue". Aí o vapor por cima fica bem adequado; confira no rótulo.</li>
    </ul>
  </section>

  <section aria-label="Passo a passo">
    <h2>Passo a passo na evaporadora</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Desligar e proteger</strong></td><td>Desligue no disjuntor, não só no controle. Retire a tampa frontal e os filtros. Cubra a placa, o display e os conectores com plástico e fita.</td></tr>
          <tr><td class="gas">2</td><td><strong>Limpeza a seco</strong></td><td>Lave os filtros na pia com sabão neutro e deixe secar. Escova macia na serpentina, sempre no sentido das aletas.</td></tr>
          <tr><td class="gas">3</td><td><strong>Instalar a bolsa coletora</strong></td><td>Bem vedada contra a parede, mangueira de saída no balde. Confira se não há fresta.</td></tr>
          <tr><td class="gas">4</td><td><strong>Aplicar o produto</strong></td><td>Na serpentina, na turbina e na bandeja. Espere o tempo de ação do rótulo, em geral 5 a 10 minutos.</td></tr>
          <tr><td class="gas">5</td><td><strong>Enxaguar bem</strong></td><td>Água limpa até sair clara no balde. Jogue água na bandeja e confira se escoa livre pelo dreno.</td></tr>
          <tr><td class="gas">6</td><td><strong>Esterilizar com vapor</strong></td><td>Serpentina, turbina, bandeja e entrada do dreno. Bico no sentido das aletas, longe da placa e das peças plásticas finas.</td></tr>
          <tr><td class="gas">7</td><td><strong>Secar e remontar</strong></td><td>Retire a bolsa, tire a proteção da placa conferindo se está seca, recoloque os filtros secos e a tampa.</td></tr>
          <tr><td class="gas">8</td><td><strong>Testar</strong></td><td>15 a 20 minutos no modo ventilação para secar. Depois no frio: dreno sem pingar dentro, sem cheiro de produto, ar bem frio.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>A <strong>turbina</strong> e a <strong>bandeja</strong> são onde mais se junta fungo, e é de lá que vem o cheiro ruim. Capriche nas duas.</li>
      <li>Tire foto da serpentina e da turbina antes e depois. É o seu controle e o cliente valoriza ver a diferença.</li>
    </ul>
  </section>

  <section aria-label="Condensadora">
    <h2>Na condensadora</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ponto</th><th>O que fazer</th></tr></thead>
        <tbody>
          <tr><td><strong>Energia</strong></td><td>Disjuntor desligado. No inverter, espere os capacitores da placa descarregarem</td></tr>
          <tr><td><strong>Proteção</strong></td><td>Cubra a placa, os bornes e o motor do ventilador</td></tr>
          <tr><td><strong>Sujeira grossa</strong></td><td>Folhas e poeira saem com escova ou ar, de dentro para fora</td></tr>
          <tr><td><strong>Produto</strong></td><td>Produto próprio de condensadora, na diluição do rótulo</td></tr>
          <tr><td><strong>Enxágue</strong></td><td>Água com pressão baixa, no sentido das aletas e de dentro para fora. Jato forte de perto amassa as aletas</td></tr>
          <tr><td><strong>Hélice e base</strong></td><td>Limpe as pás e desentupa o dreno da base</td></tr>
          <tr><td><strong>Vapor</strong></td><td>Dispensável: aqui não há o ar que a pessoa respira</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Proteção e frequência">
    <h2>Proteção e frequência</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Proteção</th><th>Por quê</th></tr></thead>
        <tbody>
          <tr><td><strong>Luvas e óculos</strong></td><td>Produto nos olhos e na pele</td></tr>
          <tr><td><strong>Máscara PFF2</strong></td><td>O vapor carrega gotículas do produto para o ar que você respira</td></tr>
          <tr><td><strong>Janela aberta</strong>, ninguém no cômodo</td><td>Principalmente criança e animal</td></tr>

      </table>
    </div>
    <div class="tbl" style="margin-top:14px">
      <table>
        <thead><tr><th>O quê</th><th>De quanto em quanto tempo</th></tr></thead>
        <tbody>
          <tr><td><strong>Filtros</strong></td><td>15 a 30 dias de uso</td></tr>
          <tr><td><strong>Higienização completa</strong>, uso residencial</td><td>Em geral a cada 6 meses; uma vez por ano em uso leve</td></tr>

        </tbody>

    </div>
    <ul class="notes"><li>Em prédios de uso público e coletivo, a Lei 13.589/2018 exige um Plano de Manutenção, Operação e Controle (PMOC) dos aparelhos de climatização.</li></ul>

  <section aria-label="Passos da instalação">
    <h2>Passo a passo</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Planejar e medir</strong></td><td>Defina o caminho da evaporadora até a condensadora e meça. Deixe uns 20 a 30 cm de folga para curvas e flanges, nada de rolo de sobra. Confira no manual a bitola das linhas e o comprimento mínimo e máximo.</td></tr>
          <tr><td class="gas">2</td><td><strong>Cortar e tampar</strong></td><td>Corte as duas linhas com o cortador e feche as pontas com fita na hora.</td></tr>
          <tr><td class="gas">3</td><td><strong>Isolar cada linha</strong></td><td>Esponjoso em cada tubo, separado. Deixe uns 10 cm livres nas pontas para trabalhar o flange.</td></tr>
          <tr><td class="gas">4</td><td><strong>Montar o feixe</strong></td><td>Linha fina, linha grossa, cabo PP e o dreno por baixo. Enfite de baixo para cima, como telha, para a água não entrar na fita.</td></tr>
          <tr><td class="gas">5</td><td><strong>Ligar na evaporadora</strong></td><td>Porca, flange e aperto no torque nos tubos da evaporadora. Cabo PP nos bornes. Isole as porcas antes de encostar no suporte.</td></tr>
          <tr><td class="gas">6</td><td><strong>Passar a parede e fixar</strong></td><td>Feixe pelo furo com caimento para fora. Evaporadora no suporte, nivelada ou com leve queda para o lado do dreno.</td></tr>
          <tr><td class="gas">7</td><td><strong>Ligar na condensadora</strong></td><td>Corte no tamanho, porca, flange. Linha fina na válvula fina, linha grossa na válvula com a saída de serviço. Torque com contra-chave.</td></tr>
          <tr><td class="gas">8</td><td><strong>Cabo PP na condensadora</strong></td><td>Mesma numeração dos bornes dos dois lados, terra ligado, parafusos apertados.</td></tr>
          <tr><td class="gas">9</td><td><strong>Não abrir as válvulas</strong></td><td>Instalação montada segue para estanqueidade e vácuo. Só depois abre as válvulas.</td></tr>

  </section>

  <section aria-label="Ferramentas da montagem">
    <h2>Ferramentas</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ferramenta</th><th>Para quê</th><th>Atenção</th></tr></thead>
        <tbody>
          <tr><td><strong>Cortador de tubo</strong></td><td>Corte reto, sem limalha</td><td>Avance a lâmina aos poucos, meia volta por vez. Nunca serra.</td></tr>
          <tr><td><strong>Escareador</strong></td><td>Tirar a rebarba de dentro</td><td>Ponta virada para baixo. Tirar demais afina a parede.</td></tr>
          <tr><td><strong>Flangeador excêntrico</strong></td><td>Fazer o cone de 45°</td><td>Tubo na altura certa do bloco (veja o gabarito). Para R-410A, flangeador próprio.</td></tr>
          <tr><td><strong>Curvador</strong> (mola ou alavanca)</td><td>Curvas sem amassar</td><td>Raio grande e suave. Tubo amassado vira restrição.</td></tr>
          <tr><td><strong>Torquímetro</strong> + contra-chave</td><td>Aperto certo da porca</td><td>Segure a conexão com outra chave para não torcer o tubo.</td></tr>
          <tr><td><strong>Fita e tampões</strong></td><td>Fechar as pontas</td><td>Tubo aberto junta poeira e umidade.</td></tr>
          <tr><td><strong>Furadeira com serra copo</strong></td><td>Passagem na parede</td><td>Furo com leve caimento para fora.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Torque por bitola">
    <h2>Aperto por bitola</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Tubo</th><th>Torque típico</th><th>Uso comum</th></tr></thead>
        <tbody style="font-variant-numeric:tabular-nums">
          <tr><td class="gas">1/4"</td><td>14 a 18 N·m</td><td>Linha de líquido (fina)</td></tr>
          <tr><td class="gas">3/8"</td><td>34 a 42 N·m</td><td>Sucção de split pequeno, líquido dos maiores</td></tr>
          <tr><td class="gas">1/2"</td><td>49 a 61 N·m</td><td>Sucção de split médio</td></tr>
          <tr><td class="gas">5/8"</td><td>68 a 82 N·m</td><td>Sucção de split grande</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Faixas comuns em manuais de fabricantes. Vale sempre o número do manual do aparelho.</li>
      <li>Aperto fraco vaza. Aperto demais trinca o flange, e às vezes o vazamento só aparece dias depois.</li>
      <li>Uma gota de óleo do próprio sistema (POE, no R-410A) na face externa do cone ajuda a assentar, se o manual permitir.</li>
    </ul>
  </section>

  <section aria-label="Cuidados">
    <h2>Cuidados da montagem</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ponto</th><th>O que fazer</th></tr></thead>
        <tbody>
          <tr><td><strong>Limpeza</strong></td><td>Pontas tampadas do começo ao fim. Sujeira e umidade dentro da linha estragam o vácuo e o compressor.</td></tr>
          <tr><td><strong>Comprimento</strong></td><td>Respeite o mínimo e o máximo do manual. Acima do padrão da etiqueta, acrescente gás por metro.</td></tr>
          <tr><td><strong>Desnível</strong></td><td>Altura máxima entre evaporadora e condensadora vem no manual. Muito desnível prejudica a volta do óleo.</td></tr>
          <tr><td><strong>Sobra de tubo</strong></td><td>Nada de rolo de tubo atrás da condensadora. Corte no tamanho.</td></tr>
          <tr><td><strong>Isolamento</strong></td><td>Cada linha com o seu esponjoso, inclusive nas porcas. Tubo sem isolamento sua e pinga.</td></tr>
          <tr><td><strong>Dreno</strong></td><td>Caimento contínuo, sem barriga. Teste com água antes de fechar.</td></tr>
          <tr><td><strong>Válvulas de serviço</strong></td><td>Ficam fechadas até terminar estanqueidade e vácuo. Só então abre.</td></tr>
          <tr><td><strong>Fixação</strong></td><td>Linhas presas e apoiadas, sem peso pendurado nos flanges.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <aside class="rule">
    <h2>Depois da montagem</h2>
    <p>Linha montada ainda não é linha pronta. Antes de abrir as válvulas da condensadora, o sistema passa pelas próximas fases:</p>
    <ol class="flow"><li>Estanqueidade</li><li>Vácuo</li><li>Abrir válvulas</li><li>Conferência</li></ol>
  </aside>
</template>

<template id="t-vazamento">

    <p class="lede">Linha montada, é hora de provar que ela é hermética. Coloca-se nitrogênio pressurizado nas linhas e observa-se: se a pressão fica parada e a espuma não borbulha nos flanges, não há vazamento.</p>

        <rect x="62" y="66" width="26" height="26" fill="var(--ink)"/>

  <section aria-label="Passo a passo">
    <h2>Passo a passo</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Conferir</strong></td><td>Válvulas da condensadora fechadas. Registros do manifold fechados. Regulador do nitrogênio todo aliviado (fechado).</td></tr>
          <tr><td class="gas">2</td><td><strong>Ligar as mangueiras</strong></td><td>Azul na saída de serviço da válvula grossa. Amarela na saída do regulador.</td></tr>
          <tr><td class="gas">3</td><td><strong>Abrir o cilindro</strong></td><td>Devagar. Depois ajuste o regulador para a pressão do teste.</td></tr>
          <tr><td class="gas">4</td><td><strong>Pressurizar em etapas</strong></td><td>Abra o registro azul e suba até uns 150 psi. Passe espuma rápido. Tudo certo, suba até a pressão de teste.</td></tr>
          <tr><td class="gas">5</td><td><strong>Isolar e marcar</strong></td><td>Feche o registro, feche o cilindro. Entre no modo estanqueidade: ele grava pressão e hora.</td></tr>
          <tr><td class="gas">6</td><td><strong>Espuma nos flanges</strong></td><td>Pincel com espuma nos quatro flanges (dois na evaporadora, dois na condensadora) e nas emendas. Espere um minuto olhando.</td></tr>
          <tr><td class="gas">7</td><td><strong>Esperar</strong></td><td>No mínimo 15 a 30 minutos. Quanto mais tempo, mais confiável. Anote a temperatura do ambiente no início e no fim.</td></tr>
          <tr><td class="gas">8</td><td><strong>Concluir</strong></td><td>Pressão parada e sem bolhas: aprovado. Solte o nitrogênio pelo manifold e siga para o vácuo.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li><strong>Pressão de teste</strong>: a do manual do aparelho. Nunca passe do limite do manifold, que vem escrito no próprio aparelho.</li>
      <li>Pode soltar o nitrogênio no ar. Ele é inerte e o ar que respiramos já é quase 80% nitrogênio. Só não solte de uma vez num lugar fechado.</li>
    </ul>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: testar com o quê?</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">

        </svg>
        <p><b>2</b>Oxigênio com óleo explode. Ar comprimido leva umidade para dentro. Os dois, nunca.</p>

        </svg>
        <p><b>4</b>Espuma no flange, pressão parada por meia hora. Agora sim, linha hermética.</p>

  </section>

  <section aria-label="Lendo o resultado">
    <h2>Lendo o resultado</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>O que aparece</th><th>Significa</th><th>O que fazer</th></tr></thead>
        <tbody>
          <tr><td>Pressão parada, sem bolhas</td><td>Linha hermética</td><td>Aliviar e ir para o vácuo</td></tr>
          <tr><td>Bolhas grandes num flange</td><td>Vazamento claro</td><td>Aliviar, refazer o flange, testar de novo</td></tr>
          <tr><td>Espuma "crescendo" devagar, bolhas finas</td><td>Microvazamento</td><td>Mesmo tratamento: refazer. É o que esvazia o aparelho em meses</td></tr>
          <tr><td>Pressão caindo sem bolha visível</td><td>Vazamento escondido (porca, válvula, emenda dentro da parede)</td><td>Separar trechos e testar por partes</td></tr>
          <tr><td>Pressão mudou pouco e o sol bateu ou o dia esfriou</td><td>Efeito da temperatura</td><td>Comparar na mesma temperatura antes de concluir</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>A pressão do gás acompanha a temperatura. Perto de 400 psi, cada 1 °C a mais ou a menos muda cerca de 1,4 psi. Por isso anotar a temperatura no começo e no fim.</li>
    </ul>
  </section>

  <section aria-label="Espuma">
    <h2>A espuma</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Ponto</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td><strong>Qual usar</strong></td><td>Espuma própria para detectar vazamento, ou água com detergente neutro bem espumada.</td></tr>
          <tr><td><strong>Onde passar</strong></td><td>Em volta de toda a porca, na junção com o tubo e no corpo da válvula. Por baixo também: use um espelho.</td></tr>
          <tr><td><strong>Quanto esperar</strong></td><td>Um minuto olhando cada flange. Microvazamento demora a mostrar.</td></tr>
          <tr><td><strong>Depois</strong></td><td>Limpe e seque antes de isolar. Resíduo de espuma corrói o cobre com o tempo.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <aside class="rule">
    <h2>Por que não pular esta fase</h2>
    <p>Vácuo não acha vazamento pequeno direito, e gás é caro. Com nitrogênio, um flange ruim aparece agora, de graça, e não daqui a três meses com o cliente ligando.</p>
  </aside>
</template>

<template id="t-vacuo">
  <header>
    <span class="eyebrow">Fase 04 · Serviço</span>
    <h1>Vácuo</h1>
    <p class="lede">Linha aprovada na estanqueidade, falta esvaziá-la. O vácuo tira o ar e, principalmente, a umidade que ficou lá dentro, para que só o gás e o óleo circulem no sistema.</p>
  </header>

  <section aria-label="Objetivo">
    <h2>Para que serve</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>O que tira</th><th>Por que atrapalha</th></tr></thead>
        <tbody>
          <tr><td><strong>Ar</strong></td><td>Não condensa. Ocupa espaço na condensadora, sobe a pressão de alta e a corrente, o aparelho rende menos.</td></tr>
          <tr><td><strong>Umidade</strong></td><td>Com o óleo do R-410A e do R-32 (POE) forma ácido e borra. Pode congelar no capilar e entupir. Ataca o verniz do motor do compressor.</td></tr>
          <tr><td><strong>Nitrogênio do teste</strong></td><td>Também não condensa. Sai junto com o ar.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>O segredo: com pouca pressão, a água ferve fria. A 25 °C ela já ferve abaixo de uns 24.000 microns. A 500 microns ferve até a cerca de −25 °C. A bomba faz a água virar vapor e o puxa para fora.</li>
      <li>Por isso vácuo leva tempo: não é só tirar o ar, é esperar a água evaporar toda.</li>
    </ul>
  </section>

  <section aria-label="Curva do vácuo">
    <h2>O que o vacuômetro mostra</h2>
    <div class="stage">
      <svg viewBox="0 0 760 360" role="img" aria-label="Gráfico em escala logarítmica: a pressão cai de 760 mil microns até abaixo de 500 em cerca de 22 minutos; com a bomba desligada, três resultados: sobe pouco e para (ok), sobe e para alto (umidade), sobe sem parar (vazamento)">
        <g stroke="var(--line)" stroke-width="1">
          <path d="M80 300H700M80 235H700M80 170H700M80 105H700M80 48H700"/>
        </g>
        <path d="M80 254.5H700" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5"/>
        <text x="704" y="258" font-family="var(--mono)" font-size="11" fill="var(--accent)">500</text>
        <g font-family="var(--mono)" font-size="11" fill="var(--muted)" text-anchor="end">
          <text x="74" y="304">100</text><text x="74" y="239">1.000</text><text x="74" y="174">10.000</text><text x="74" y="109">100.000</text><text x="74" y="52">760.000</text>
        </g>
        <text x="10" y="24" font-family="var(--mono)" font-size="11" fill="var(--muted)">microns (escala log)</text>
        <g font-family="var(--mono)" font-size="11" fill="var(--muted)" text-anchor="middle">
          <text x="80" y="320">0</text><text x="235" y="320">10</text><text x="390" y="320">20</text><text x="545" y="320">30</text><text x="700" y="320">40 min</text>
        </g>
        <path d="M440 40V300" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 4"/>
        <text x="446" y="64" font-family="var(--mono)" font-size="11" fill="var(--muted)">bomba desligada,</text>
        <text x="446" y="78" font-family="var(--mono)" font-size="11" fill="var(--muted)">registro fechado</text>
        <!-- descida -->
        <path d="M80 48 C120 120 150 150 200 175 S300 225 440 254" fill="none" stroke="var(--low)" stroke-width="4"/>
        <!-- três resultados -->
        <path d="M440 254 C470 247 500 245 690 244" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
        <path d="M440 254 C470 225 500 216 690 214" fill="none" stroke="var(--warn)" stroke-width="3.5"/>
        <path d="M440 254 L690 150" fill="none" stroke="var(--high)" stroke-width="3.5"/>
        <g font-family="var(--display)" font-size="15" font-weight="700">
          <text x="600" y="268" fill="var(--accent)">PAROU BAIXO: OK</text>
          <text x="560" y="206" fill="var(--warn)">PAROU ALTO: UMIDADE</text>
          <text x="540" y="140" fill="var(--high)">NÃO PARA: VAZAMENTO</text>
        </g>
        <circle r="6" fill="var(--low)" class="vac" style="offset-path:path('M80 48 C120 120 150 150 200 175 S300 225 440 254')"/>
        <text x="90" y="345" font-family="var(--mono)" font-size="11" fill="var(--muted)">curva típica de um split pequeno com bomba boa; o tempo real varia com o tamanho da linha e a umidade</text>
      </svg>
      <p class="cap">A pressão do ar (760.000 microns) cai rápido no começo. Depois desacelera enquanto a umidade evapora. O que decide o serviço é o teste de queda, com a bomba isolada.</p>
    </div>
  </section>

  <section aria-label="Métodos">
    <h2>Os métodos</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>Método</th><th>Como é</th><th>Quando usar</th></tr></thead>
        <tbody>
          <tr><td><strong>Vácuo com vacuômetro</strong></td><td>Bomba até abaixo de 500 microns, depois teste de queda</td><td>Sempre que der. É o único que dá certeza.</td></tr>
          <tr><td><strong>Vácuo triplo</strong></td><td>Três vácuos seguidos, quebrando com nitrogênio entre eles</td><td>Linha que pegou umidade, chuva, ou quando não tem vacuômetro</td></tr>
          <tr><td><strong>Por tempo</strong></td><td>Bomba ligada um tempo fixo, sem medir</td><td>Só como parte do método seguro abaixo, nunca sozinho</td></tr>
          <tr><td class="a3" style="color:var(--high)"><strong>Purga com o gás</strong></td><td>Soltar gás da condensadora para "empurrar" o ar</td><td><strong>Não faça.</strong> Não tira umidade, perde gás e é proibido soltar na atmosfera</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section aria-label="Com vacuômetro">
    <h2>Com vacuômetro: passo a passo</h2>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Preparar a bomba</strong></td><td>Óleo limpo, no nível. Óleo leitoso ou escuro não faz vácuo.</td></tr>
          <tr><td class="gas">2</td><td><strong>Ligar</strong></td><td>Azul na saída de serviço, amarela na bomba. Mangueiras curtas e engates bem firmes. Válvulas da condensadora seguem fechadas.</td></tr>
          <tr><td class="gas">3</td><td><strong>Puxar</strong></td><td>Ligue a bomba, abra o registro, modo vacuômetro. Deixe passar de 500 microns e ainda uns 10 a 15 minutos a mais.</td></tr>
          <tr><td class="gas">4</td><td><strong>Isolar</strong></td><td>Feche o registro primeiro, depois desligue a bomba. Assim o óleo da bomba não volta para a mangueira.</td></tr>
          <tr><td class="gas">5</td><td><strong>Teste de queda</strong></td><td>Observe 10 a 15 minutos. Subiu pouco e parou abaixo de uns 1.000 microns: aprovado.</td></tr>
          <tr><td class="gas">6</td><td><strong>Abrir as válvulas</strong></td><td>Com a chave Allen: primeiro a fina (líquido), depois a grossa (sucção), até o fim. O gás da condensadora enche a linha.</td></tr>
          <tr><td class="gas">7</td><td><strong>Fechar</strong></td><td>Retire a mangueira rápido, recoloque as tampas das válvulas e da saída de serviço bem apertadas. As tampas também vedam.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Não baixou de 500? Antes de culpar o aparelho, troque o óleo da bomba e confira mangueiras e engates. São os culpados mais comuns.</li>
      <li>O seu manifold digital tem o modo vacuômetro: use ele aqui.</li>
    </ul>
  </section>

  <section aria-label="Sem vacuômetro">
    <h2>Sem vacuômetro: o método seguro</h2>
    <p style="margin:0 0 14px">Sem medir em microns não há como ter certeza de que a umidade saiu. O jeito seguro é compensar com folga de tempo e com o vácuo triplo, que arrasta a umidade com o nitrogênio seco.</p>
    <div class="tbl">
      <table>
        <thead><tr><th>#</th><th>Passo</th><th>Como fazer</th></tr></thead>
        <tbody>
          <tr><td class="gas">1</td><td><strong>Estanqueidade aprovada</strong></td><td>Obrigatória aqui. Sem vacuômetro, o vácuo não vai acusar vazamento pequeno.</td></tr>
          <tr><td class="gas">2</td><td><strong>1º vácuo</strong></td><td>Bomba de duplo estágio, óleo novo, uns 15 minutos.</td></tr>
          <tr><td class="gas">3</td><td><strong>Quebra com nitrogênio</strong></td><td>Feche o registro, desligue a bomba e coloque nitrogênio até uma pressão baixinha, uns 2 a 5 psi. Espere 5 minutos para ele absorver umidade. Solte.</td></tr>
          <tr><td class="gas">4</td><td><strong>2º vácuo + quebra</strong></td><td>Repita o vácuo e a quebra.</td></tr>
          <tr><td class="gas">5</td><td><strong>3º vácuo, longo</strong></td><td>O último vácuo bem demorado: pelo menos 30 a 60 minutos num split pequeno. Linha longa ou dia úmido, mais.</td></tr>
          <tr><td class="gas">6</td><td><strong>Ponteiro parado</strong></td><td>Isole e observe o manômetro de baixa no fundo da escala de vácuo por 15 minutos. Se o ponteiro subir, há problema.</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>O manômetro comum mostra "vácuo" desde uns 25.000 microns até zero, tudo no mesmo ponto. Ele só serve para mostrar que não há vazamento grosseiro, não para garantir a secagem.</li>
      <li>É método de emergência. Para trabalhar com inverter e R-410A, o vacuômetro é ferramenta obrigatória da caixa.</li>
    </ul>
  </section>

  <section aria-label="Tirinha">
    <h2>Tirinha: o vácuo de cinco minutos</h2>
    <div class="strip">
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <use href="#tec" x="20" y="50" width="40" height="80"/>
          <rect x="74" y="18" width="112" height="56" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <path d="M86 74 l-10 14 l22 -14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
          <text x="130" y="42" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--ink)">5 MINUTINHOS</text>
          <text x="130" y="60" text-anchor="middle" font-size="13" font-family="var(--display)" font-weight="700" fill="var(--ink)">TÁ BOM</text>
        </svg>
        <p><b>1</b>Bomba ligada cinco minutos, ponteiro no fundo. "Tá bom."</p>
      </figure>
      <figure class="panel" style="margin:0">
        <svg viewBox="0 0 200 140" aria-hidden="true">
          <rect x="20" y="60" width="160" height="20" fill="var(--cu)" stroke="var(--ink)"/>
          <g fill="var(--low)"><path d="M60 70 q5 -9 10 0 q-5 9 -10 0z"/><path d="M100 70 q5 -9 10 0 q-5 9 -10 0z"/><path d="M140 70 q5 -9 10 0 q-5 9 -10 0z"/></g>
          <text x="100" y="45" text-anchor="middle" font-size="14" font-family="var(--display)" font-weight="700" fill="var(--low)">UMIDADE FICOU</text>
        </svg>
        <p><b>2</b>A água ainda estava lá dentro. Com o óleo, virou ácido e borra.</p>

  <section aria-label="Por que escolher o gás">
    <h2>Por que o digital pede o gás</h2>
    <p style="margin:0 0 14px">Os dois manifolds medem só <strong>pressão</strong>, e a pressão é a mesma seja qual for o gás. O que muda é a <strong>temperatura de saturação</strong>: cada gás ferve numa temperatura diferente para a mesma pressão. O analógico traz essa conversão impressa em anéis coloridos, um para cada gás. O digital guarda as tabelas na memória e precisa saber qual usar.</p>
    <div class="pt">
      <div class="pt-gauge"><svg id="pt-svg" viewBox="0 0 400 400" role="img" aria-label="Mostrador analógico de 0 a 500 psi com anéis de temperatura para R-410A, R-32, R-22 e R-134a"></svg></div>
      <div class="pt-ctl">
        <label for="pt-p" class="pt-lab">Pressão no manômetro: <output id="pt-pv">118</output> psi</label>
        <input id="pt-p" type="range" min="0" max="500" step="1" value="118">
        <div class="pt-gases" role="group" aria-label="Gás selecionado no digital" id="pt-gases"></div>
        <div class="pt-lcd" aria-live="polite"><span id="pt-gn">R-410A</span><b id="pt-t">4,4 °C</b><small>temperatura de saturação</small></div>
        <ul class="pt-all" id="pt-all"></ul>
      </div>
    </div>
    <p class="cap" style="margin-top:10px">Arraste a pressão e troque o gás. No analógico, a mesma leitura do ponteiro é lida no anel da cor do gás. Valores aproximados de tabelas pressão × temperatura, para entender o princípio.</p>
    <div class="tbl" style="margin-top:14px">
      <table>
        <thead><tr><th>O que aparece</th><th>Precisa saber o gás?</th><th>Por quê</th></tr></thead>
        <tbody>
          <tr><td><strong>Pressão</strong></td><td>Não</td><td>É só a força do gás no sensor</td></tr>
          <tr><td><strong>Temperatura de saturação</strong></td><td>Sim</td><td>Vem da tabela do gás</td></tr>
          <tr><td><strong>Superaquecimento e sub-resfriamento</strong></td><td>Sim</td><td>Usam a temperatura de saturação na conta</td></tr>
          <tr><td><strong>Vácuo e estanqueidade</strong></td><td>Não</td><td>Só pressão e tempo</td></tr>
        </tbody>
      </table>
    </div>
    <h3 class="kit-h">Um mostrador não cabe todos os gases</h3>
    <div class="tbl">
      <table>
        <thead><tr><th>Manifold analógico</th><th>Escalas que costuma trazer</th><th>Alta vai até</th></tr></thead>
        <tbody>
          <tr><td><strong>Gases antigos</strong></td><td>R-22, R-134a, R-404A</td><td>~500 psi</td></tr>
          <tr><td><strong>Split moderno</strong></td><td>R-410A, R-32</td><td>~800 psi</td></tr>
          <tr><td><strong>Automotivo</strong></td><td>R-134a, R-1234yf</td><td>~500 psi</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="notes">
      <li>Gás sem anel no mostrador: leia a pressão e procure a temperatura numa tabela pressão × temperatura, de papel ou aplicativo.</li>
      <li>O mostrador precisa aguentar a pressão do gás. Relógio de R-22 no R-410A pode passar do fim da escala e estragar.</li>
      <li>No digital, confira a etiqueta da condensadora antes de escolher o gás no menu. Gás errado no menu dá superaquecimento errado, e aí se tira ou se coloca gás à toa.</li>
      <li>R-410A e R-32 têm pressões parecidas: trocar um pelo outro no menu engana pouco na pressão, mas desloca a temperatura em 1 ou 2 °C.</li>
    </ul>
  </section>
